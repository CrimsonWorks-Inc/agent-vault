    },

    async approvals() {
      // Everything here comes from GET pending, which the server builds with
      // src/pending.js — the same module the CLI renders from. This function
      // paints what it is given and decides nothing: which kinds exist, what
      // they are called, what may be narrowed and which route settles them all
      // live in one place, so a new kind of decision shows up in both
      // interfaces at once instead of in whichever one someone remembered.
      const pending = await api('GET', 'pending')
      if (!pending.length) {
        return `<header class="page"><h1>Approvals</h1></header>
          <p class="sub">Requests an agent cannot make without you.</p>
          <div class="card"><div class="empty">Nothing waiting.</div></div>`
      }
      return `
        <header class="page"><h1>Approvals</h1><span class="pill warn">${pending.length} waiting</span></header>
        <p class="sub">The summary is written by the daemon from what it actually received.
          The reason is whatever the agent claimed, and is not verified.</p>
        <div class="card" id="bulkBar" hidden><div class="body">
          <div class="meta" style="margin-bottom:8px"><strong><span id="bulkCount">0</span> selected</strong>
            &middot; one signature covers exactly these, and nothing that arrives after.</div>
          <div class="actions">
            <button class="action primary" data-act="decide-many" data-granted="1">Approve selected</button>
            <button class="action danger" data-act="decide-many" data-granted="">Deny selected</button>
            <button class="action" data-act="select-none">Clear</button>
          </div>
        </div></div>
        ${pending.map((item) => `
          <div class="card" data-item="${esc(item.id)}"><div class="body">
            <label class="meta pick" style="margin-bottom:8px">
              <input type="checkbox" class="bulk-pick" data-id="${esc(item.id)}" data-kind="${esc(item.kind)}">
              <span>select</span></label>
            <div class="meta" style="color:var(--muted);margin-bottom:6px">
              ${item.kind === 'session' ? 'session requested' : 'held request'}
              &middot; <span class="mono">${esc(item.id)}</span>
              &middot; asked ${esc(ago(item.created_at))}</div>
            <div class="mono" style="font-size:14px;font-weight:600;margin-bottom:6px">${esc(item.headline)}</div>
            ${item.proposal?.template ? `<div class="meta">template <span class="mono">${esc(item.proposal.template)}</span> v${esc(item.proposal.template_version ?? '?')}</div>` : ''}
            ${item.claim ? `<div class="notice">Claimed by the agent, unverified: ${esc(item.claim)}</div>` : ''}
            ${item.kind === 'request' ? previewBlock(item.preview, item.id) : ''}
            ${item.caution ? `<div class="notice warn">${esc(item.caution)}</div>` : ''}
            ${item.narrowable.length ? `
              <div class="meta" style="color:var(--muted);margin:10px 0 6px">Narrow it before approving, if it asks for more than it needs:</div>
              <div class="narrow" data-for="${esc(item.id)}">
                ${item.narrowable.map((f) => `
                  <label class="field"><span>${esc(f)}</span>
                    <input class="narrow-input" data-field="${esc(f)}"
                      placeholder="${esc(String(item.proposal[f] ?? 'unchanged'))}"></label>`).join('')}
              </div>` : ''}
            ${(item.owner_settable || []).length ? `
              <div class="meta" style="color:var(--muted);margin:10px 0 6px">Owner options, which the agent cannot ask for:</div>
              <div class="owner" data-for="${esc(item.id)}">
                <label class="field"><span>approval</span>
                  <select class="owner-approval">
                    <option value="">unchanged</option>
                    <option value="on-write">on-write</option>
                    <option value="each">each</option>
                    <option value="first-use">first-use</option>
                    <option value="auto">auto: never ask</option>
                  </select></label>
                <label class="field pick"><input type="checkbox" class="owner-infinite"> <span>No expiry</span></label>
              </div>` : ''}
            <div class="actions">
              <button class="action primary" data-act="decide" data-id="${esc(item.id)}"
                data-kind="${esc(item.kind)}" data-granted="1">
                ${item.kind === 'session' ? 'Approve session' : 'Approve once'}</button>
              <button class="action danger" data-act="decide" data-id="${esc(item.id)}"
                data-kind="${esc(item.kind)}" data-granted="">Deny</button>
            </div>
          </div></div>`).join('')}`
    },

    async audit() {
      // The log is encrypted with a key derived from the vault key, so while
      // the vault is locked there is nothing to show and that is the answer,
      // not an error.
      let rows
      try {
        rows = await api('GET', 'audit?limit=60')
      } catch (e) {
        // Ask the vault rather than reading the error text: an older daemon
        // reports this as an internal error instead of a lock.
        const ls = await api('GET', 'lockstate').catch(() => ({}))
        if (!ls.locked) throw e
        return `<header class="page"><h1>Audit</h1><span class="pill crit">locked</span></header>
          <p class="sub">The log is encrypted with the vault key, so it cannot be read while the vault is locked.</p>
          <div class="notice"><strong>Unlock to read the audit log.</strong>
            <div style="margin-top:10px"><button class="action primary" data-act="goto-overview">Go to Overview</button></div></div>`
      }
      const head = rows.reduce((a, r) => (Number.isInteger(r?.seq) && (!a || r.seq > a.seq) ? r : a), null)
      return `
        <header class="page"><h1>Audit</h1></header>
        <p class="sub">Append-only, hash-chained, and anchored at its end. Paths are recorded and scrubbed; no credential value, body, query string or full placeholder ever is.</p>
        <div class="card"><h2>Witness</h2><div class="row"><div class="main">
          <div class="name mono">${head ? `head: record ${esc(head.seq)}, ${esc(String(head.hash || '').slice(0, 16))}…` : 'head: no records yet'}</div>
          <div class="meta">A checkpoint is the head, signed with a key only this vault holds. Kept somewhere an agent
            cannot write, it shows later whether records were removed.</div></div>
          <div class="actions"><button class="action" data-act="copy-checkpoint">Copy checkpoint</button></div></div>
          ${checkpoint ? `<div class="body">${codeRow('Checkpoint', JSON.stringify(checkpoint))}</div>` : ''}</div>
        <div class="card"><h2>Recent</h2><div class="audit">
          ${rows.slice().reverse().map((r) => {
            const cls = r.decision === 'allow' ? 't-allow' : r.decision === 'deny' ? 't-deny' : 't-dim'
            const note = r.reason_code || r.credential_slug || r.detail || ''
            return `<div class="line"><span class="t-dim">${esc(r.ts.slice(11, 19))}</span>
              <span class="${cls}">${esc(r.decision || '')}</span>
              <span>${esc(r.kind)}</span><span class="t-dim">${esc(note)}</span></div>`
          }).join('')}
        </div></div>`
    },

    async docs() {
      await loadDocsCtx()
      const section = DOCS.find((d) => d.id === docsSection) || DOCS[0]
      return `
        <header class="page"><h1>Docs</h1>
          ${docsCtx.version ? `<span class="pill">v${esc(docsCtx.version)}</span>` : ''}</header>
        <p class="sub">Written against this install, so the commands below are yours to paste.</p>
        <div class="docnav">${DOCS.map((d) =>
          `<button data-doc="${esc(d.id)}" aria-current="${d.id === section.id}">${esc(d.title)}</button>`).join('')}</div>
        ${section.body(docsCtx)}`
    },
  }

  // ---------------------------------------------------------------- actions

  const actions = {
    async verify() {
      const v = await api('GET', 'audit/verify')
      toast(v.ok ? `Chain intact across ${v.count} records` : `Chain broken at record ${v.brokenAt}`)
    },
    async 'goto-overview'() {
      current = 'overview'
      syncNav()
      render()
    },
    async 'touchid-unlock'() {
      await touchIdUnlock()
      vaultLocked = false
      toast('Unlocked with Touch ID')
      render()
    },
    async 'touchid-enable'() {
      await enableTouchId()
      toast('Touch ID unlock enabled')
      render()
    },
    async 'touchid-disable'() {
      await gated({ op: 'touchid.remove' }, (proof) => api('POST', 'touchid/remove', { presence: proof }))
      toast('Touch ID unlock turned off')
      render()
    },
    async unlock() {
      // Unlocking is the way in, so it is not behind the change-confirmation
      // gate: the passphrase itself is the proof. Routing it through that gate
      // wrongly required a confirmation authenticator to exist first.
      const state = await api('GET', 'lockstate')
      const passphrase = state.needs_secret ? await askSecret('Vault passphrase') : null
      if (state.needs_secret && passphrase == null) return toast('Cancelled')
      const res = await api('POST', 'unlock/passphrase', { passphrase })
      if (res.locked) return toast('That passphrase did not unlock the vault')
      vaultLocked = false
      toast('Unlocked')
      render()
    },
    async enroll() {
      await enroll()
      toast('Authenticator enrolled')
      render()
    },
    async 'add-cred'() {
      const slug = document.getElementById('slug').value.trim()
      const value = document.getElementById('value').value
      const kind = document.getElementById('kind').value
      const host = document.getElementById('host').value.trim()
      if (!slug || !value) return toast('A name and a value are both required')
      const body = { slug, kind, value, host: host || undefined }
      await gated(await operationFor('cred.add', body), (proof) =>
        api('POST', 'credentials', { ...body, presence: proof }))
      document.getElementById('value').value = ''
      toast(`Stored ${slug}`)
      render()
    },
    async 'rm-cred'(btn) {
      const slug = btn.dataset.slug
      if (!confirm(`Remove ${slug}? Every grant using it is revoked.`)) return
      await gated(await operationFor('cred.remove', { slug }), (proof) =>
        api('DELETE', `credentials?slug=${encodeURIComponent(slug)}`, { presence: proof }))
      toast('Removed')
      render()
    },
    async 'add-session'() {
      let body
      let picked
      if (formTemplate) {
        const t = formTemplate
        const chosen = {
          label: document.getElementById('sLabel').value.trim(),
          methods: [...document.querySelectorAll('.t-method:checked')].map((b) => b.value),
          approval: document.getElementById('tApproval').value,
          budget: document.getElementById('tBudget').value,
          lifetime: document.getElementById('tLifetime').value,
          grantTtl: document.getElementById('tGrantTtl').value,
        }
        const { overrides, error } = templateOverrides(t.limits, chosen)
        if (error) return toast(error)
        // The hash is the one fetched with the template on screen, so an edit
        // made after you looked is refused by the daemon (template_changed).
        body = { template: t.name, template_hash: t.hash, ...overrides }
        picked = t.limits.creds
      } else {
        const form = readSessionForm()
        if (form.error) return toast(form.error)
        ;({ body, picked } = form)
      }
      const s = await gated(
        await operationFor('session.create', body),
        (proof) => api('POST', 'sessions', { ...body, presence: proof }),
      )
      // Carry the first credential's own injection site through, so the
      // example call puts the placeholder where it actually goes.
      const creds = await api('GET', 'credentials').catch(() => [])
      const first = s.grants?.[0]?.cred ?? picked[0]
      const cred = creds.find((c) => c.slug === first)
      const { cli } = await loadDocsCtx()
      lastSession = { ...s, cli, sites: cred?.fields?.[0]?.sites || [], probe: cred?.probe_path || '' }
      formTemplate = null
      toast(`Session ${s.session_id} created`)
      render()
    },
    async 'dismiss-handoff'() {
      lastSession = null
      render()
    },
    async revoke(btn) {
      const sid = btn.dataset.sid
      await gated(await operationFor('session.revoke', { sid }), (proof) =>
        api('DELETE', `sessions?sid=${encodeURIComponent(sid)}`, { presence: proof }))
      toast('Revoked')
      render()
    },
    /**
     * Answer one waiting decision, of whichever kind.
     *
     * The kind and the id both came from GET pending, so this does not decide
     * what can be narrowed or which route settles it — it carries what it was
     * given. The signature covers the verdict AND any narrowing, so an approval
     * of "GET /user only" cannot be replayed to grant the wide original.
     */
    /**
     * Several decisions, one signature.
     *
     * The list is built from what is TICKED, never from "everything pending" —
     * the signature binds this exact set, so a request that arrives between
     * signing and executing is not covered by it and is not touched.
     *
     * Per-item narrowing is deliberately not carried here: a narrowing is a
     * considered edit to one proposal, and a screen where you tick twelve boxes
     * is not where that attention exists. Narrow one at a time, in its own card.
     */
    async 'decide-many'(btn) {
      const granted = btn.dataset.granted === '1'
      const decisions = [...document.querySelectorAll('.bulk-pick:checked')]
        .map((box) => ({ id: box.dataset.id, kind: box.dataset.kind, granted }))
      if (!decisions.length) return toast('Nothing selected')

      const op = await operationFor('pending.decide_many', { decisions })
      const answered = await gated(op, (proof) => api('POST', 'pending/decide-many', { decisions, presence: proof }))

      // Say what actually happened to each one. An item can stop being pending
      // between the page rendering and the signature landing, and a human who
      // decided five things is owed an answer about five things.
      const skipped = (answered?.decided || []).filter((r) => r.outcome === 'skipped')
      if (skipped.length) {
        toast(`${decisions.length - skipped.length} ${granted ? 'approved' : 'denied'}, ${skipped.length} no longer pending`)
      } else {
        toast(`${decisions.length} ${granted ? 'approved' : 'denied'}`)
      }
      if (answered?.note) toast(answered.note)
      selected.clear()
      render()
    },

    'select-none'() {
      selected.clear()
      for (const box of document.querySelectorAll('.bulk-pick:checked')) box.checked = false
      syncBulkBar()
    },

    async decide(btn) {
      const id = btn.dataset.id
      const granted = btn.dataset.granted === '1'
      const typed = {}
      if (granted) {
        for (const input of document.querySelectorAll(`.narrow[data-for="${id}"] .narrow-input`)) {
          if (input.value.trim()) typed[input.dataset.field] = input.value.trim()
        }
        const owner = document.querySelector(`.owner[data-for="${id}"]`)
        if (owner) {
          typed.approval = owner.querySelector('.owner-approval').value
          if (owner.querySelector('.owner-infinite').checked) typed.infinite = true
        }
      }
      // Parsed before it is signed. The raw text ("GET", "100") was signed and
      // the server rebuilt the operation from parsed values (["GET"], 100), so
      // every narrowing typed here failed as a different operation.
      const overrides = parseOverrides(typed)
      if (btn.dataset.kind === 'session') {
        const op = await operationFor('session_request.decide', { id, granted, ...overrides })
        await gated(op, (proof) => api('POST', 'session-requests/decide', {
          id, granted, overrides: granted ? overrides : undefined, presence: proof,
        }))
      } else {
        const op = await operationFor(granted ? 'approval.approve' : 'approval.deny', { id, granted })
        await gated(op, (proof) => api('POST', 'approvals', { id, granted, presence: proof }))
      }
      for (const key of [...drafts.keys()]) if (key.startsWith(`${id}|`)) drafts.delete(key)
      toast(granted ? 'Approved' : 'Denied')
      render()
    },

    // --- wave 3 -------------------------------------------------------------

    async 'add-route'() {
      const box = document.getElementById('routes')
      if (!box) return
      if (box.querySelectorAll('.route').length >= MAX_ROUTE_ROWS) return toast(`At most ${MAX_ROUTE_ROWS} routes`)
      box.insertAdjacentHTML('beforeend', routeRow())
    },
    'rm-route'(btn) { btn.closest('.route')?.remove() },

    async 'save-template'() {
      const form = readSessionForm()
      if (form.error) return toast(form.error)
      const name = await askText('Template name (lower case, digits and dashes)', { placeholder: 'gh-read', submit: 'Save' })
      if (!name) return
      // The spec is the session this form would create, as it would send it.
      const body = { name, spec: form.body }
      const saved = await gated(await operationFor('template.save', body), (proof) =>
        api('POST', 'templates', { ...body, presence: proof }))
      const problems = (saved.lint || []).length
      toast(`Saved template ${saved.name} v${saved.version}${problems ? `, ${problems} warning${problems > 1 ? 's' : ''}` : ''}`)
      render()
    },
    async 'rm-template'(btn) {
      const name = btn.dataset.name
      await gated(await operationFor('template.delete', { name }), (proof) =>
        api('DELETE', `templates?name=${encodeURIComponent(name)}`, { presence: proof }))
      if (formTemplate?.name === name) formTemplate = null
      toast(`Deleted template ${name}`)
      render()
    },
    async 'clear-template'() {
      formTemplate = null
      render()
    },

    async detail(btn) {
      sessionDetail = await api('GET', `sessions/detail?sid=${encodeURIComponent(btn.dataset.sid)}`)
      render()
      window.scrollTo({ top: 0 })
    },
    'close-detail'() { sessionDetail = null; render() },

    /** One of the three one-click narrowings (F15). Each can only take away. */
    async narrow(btn) {
      const sid = btn.dataset.sid
      const which = NARROWINGS[btn.dataset.narrow]
      if (!which) return
      const body = which.body(sid)
      const result = await gated(await operationFor('session.narrow', body), (proof) =>
        api('POST', 'sessions/narrow', { ...body, presence: proof }))
      narrowResult = { title: which.title, result }
      if (sessionDetail?.session?.id === sid) sessionDetail = null
      toast(which.title)
      render()
    },
    'dismiss-narrow'() { narrowResult = null; render() },

    async 'test-cred'(btn) {
      const slug = btn.dataset.slug
      try {
        testResults.set(slug, await api('POST', 'credentials/test', { slug }))
      } catch (e) {
        testResults.set(slug, { error: e.message })
      }
      slow.clear()
      render()
    },

    /** A new value for a credential (F7): typed here, signed by digest, never echoed. */
    async 'rotate-cred'(btn) {
      const slug = btn.dataset.slug
      const choice = await dialog(`
        <label for="rotValue">New value for ${esc(slug)} (not echoed)</label>
        <input id="rotValue" type="password" autocomplete="new-password" spellcheck="false">
        <label for="rotMode">Sessions using it</label>
        <select id="rotMode">
          <option value="keep">keep working, with the new value</option>
          <option value="revoke">lose their grants now</option>
        </select>
        <label for="rotRetire">Keep scrubbing the old value for (hours)</label>
        <input id="rotRetire" type="number" min="0" max="168" value="24">`,
      (f) => ({ value: f.querySelector('#rotValue').value, mode: f.querySelector('#rotMode').value, retire: f.querySelector('#rotRetire').value }),
      { submit: 'Next' })
      if (!choice) return
      if (!choice.value) return toast('No value was typed. Nothing was changed.')
      const body = { slug, value: choice.value, mode: choice.mode, retire_hours: Number(choice.retire) }
      const operation = await operationFor('cred.rotate', body)
      if (!(await showOperation(`Rotate ${slug}`, operation))) return toast('Cancelled. Nothing was changed.')
      const r = await gated(operation, (proof) => api('POST', 'credentials/rotate', { ...body, presence: proof }))
      const denied = Number(r.invalidated_approvals) || 0
      toast(`Rotated ${slug} to version ${r.rotated?.version ?? '?'}${denied ? `; ${denied} held request${denied > 1 ? 's' : ''} denied` : ''}`)
      render()
    },

    async 'quarantine-cred'(btn) {
      const slug = btn.dataset.slug
      const reason = await askText(`Quarantine ${slug}: nothing can use it until you release it. Reason (optional)`, { submit: 'Quarantine' })
      if (reason === null) return
      const r = await api('POST', 'credentials/quarantine', { slug, ...(reason ? { reason } : {}) })
      const denied = Number(r.denied_approvals) || 0
      toast(`Quarantined ${slug}${denied ? `; ${denied} held request${denied > 1 ? 's' : ''} denied` : ''}`)
      slow.clear()
      render()
    },
    async 'release-cred'(btn) {
      const slug = btn.dataset.slug
      await gated(await operationFor('cred.release', { slug }), (proof) =>
        api('POST', 'credentials/release', { slug, presence: proof }))
      toast(`Released ${slug}`)
      slow.clear()
      render()
    },

    async 'add-scrub'(btn) {
      const slug = btn.dataset.slug
      const field = (cls) => [...document.querySelectorAll(cls)].find((x) => x.dataset.slug === slug)
      const pattern = field('.scrub-pattern')?.value.trim()
      const sample = field('.scrub-sample')?.value
      if (!pattern) return toast('Type a pattern first')
      const body = { slug, pattern, ...(sample ? { sample } : {}) }
      const r = await gated(await operationFor('cred.scrub_add', body), (proof) =>
        api('POST', 'credentials/scrub', { ...body, presence: proof }))
      if (r.sample) scrubSamples.set(slug, r.sample)
      else scrubSamples.delete(slug)
      openDetails.add(`scrub:${slug}`)
      toast(`Added ${r.id || 'the pattern'} to ${slug}`)
      render()
    },
    async 'rm-scrub'(btn) {
      const { slug, id } = btn.dataset
      await gated(await operationFor('cred.scrub_remove', { slug, id }), (proof) =>
        api('DELETE', `credentials/scrub?slug=${encodeURIComponent(slug)}&id=${encodeURIComponent(id)}`, { presence: proof }))
      toast(`Removed ${id}`)
      render()
    },

    async 'set-expiry'(btn) {
      const slug = btn.dataset.slug
      const day = [...document.querySelectorAll('.expiry-date')].find((x) => x.dataset.slug === slug)?.value
      if (!day) return toast('Pick a date first')
      await setExpiry(slug, new Date(`${day}T00:00:00Z`).toISOString())
    },
    async 'clear-expiry'(btn) { await setExpiry(btn.dataset.slug, null) },

    /** Panic (F16), confirmed in a dialog this page draws, never window.confirm. */
    async panic() {
      const choice = await dialog(`
        <label>Panic: end every session now</label>
        <p class="meta">Every session is revoked, infinite ones included, and everything waiting for you is denied.
          Nothing comes back by itself.</p>
        <label class="pick"><input type="checkbox" id="panicLock"> <span>Lock the vault too</span></label>
        <input id="panicReason" maxlength="200" placeholder="reason, for the audit log (optional)" autocomplete="off">`,
      (f) => ({ lock: f.querySelector('#panicLock').checked === true, reason: f.querySelector('#panicReason').value.trim() }),
      { submit: 'Panic now', danger: true })
      if (!choice) return
      const r = await api('POST', 'panic', { lock: choice.lock, ...(choice.reason ? { reason: choice.reason } : {}) })
      toast(`Panic: ${r.revoked_sessions ?? 0} sessions revoked · ${r.denied_approvals ?? 0} held requests denied`
        + ` · ${r.denied_session_requests ?? 0} session requests denied${r.locked ? ' · vault locked' : ''}`)
      lastSession = null
      slow.clear()
      render()
    },

    async 'tripwires-on'() {
      // With no rules stored yet, turning them on also stores the defaults,
      // which makes it a change the daemon gates like any other.
      const body = (tripwireState?.rules || []).length ? { enabled: true } : { enabled: true, rules: 'defaults' }
      await setTripwires(body, 'Tripwires on')
    },
    async 'tripwires-off'() { await setTripwires({ enabled: false }, 'Tripwires off') },
    async 'tripwires-save'() {
      let rules
      try { rules = JSON.parse(document.getElementById('twRules').value) } catch (e) { return toast(`The rules are not JSON: ${e.message}`) }
      if (!Array.isArray(rules)) return toast('The rules must be a JSON list')
      await setTripwires({ rules }, 'Tripwire rules saved')
    },

    async 'replace-key'() {
      await replaceKey()
      toast('Authenticator replaced. The old one no longer confirms anything.')
      render()
    },

    async 'copy-checkpoint'() {
      checkpoint = await api('GET', 'audit/checkpoint')
      render()
    },
  }

  /** The session's strictest mode, in the warning colour when it never asks about writes. */
  function approvalBadge(s) {
    const order = ['auto', 'first-use', 'on-write', 'each']
    const modes = (s.creds || []).map((c) => c.approval ?? 'auto')
    if (!modes.length) return ''
    const rank = (m) => (order.includes(m) ? order.indexOf(m) : order.length)
    const mode = modes.reduce((a, b) => (rank(b) > rank(a) ? b : a))
    const elevated = (s.elevated || []).includes('approval_auto_writes')
    return `<span class="pill ${elevated ? 'warn' : ''}">approval: ${esc(elevated ? 'auto' : mode)}</span>`
  }

  /** Show what the new-session form is about to ask for, before anything is signed. */
  function syncSessionWarnings() {
    const approval = document.getElementById('sApproval')
    if (!approval) return
    const methods = document.getElementById('sMethods').value.split(',').map((m) => m.trim()).filter(Boolean)
    document.getElementById('sAutoWarn').hidden = !autoWrites(approval.value, methods)
    document.getElementById('sNeverWarn').hidden = document.getElementById('sLifetime').value !== 'never'
  }
  document.addEventListener('input', (e) => {
    if (['sApproval', 'sMethods', 'sLifetime'].includes(e.target?.id)) syncSessionWarnings()
  })

  /** Spend limits mean something only for a model provider's credential (F5). */
  function syncSpendBox() {
    const box = document.getElementById('spendBox')
    const pick = document.getElementById('sCred')
    if (!box || !pick) return
    box.hidden = ![...pick.selectedOptions].some((o) => MODEL_KINDS.includes(credKinds.get(o.value)))
  }

  /** Fill the form from a template: its fields become the ceiling (F17). */
  async function chooseTemplate(name) {
    if (!name) { formTemplate = null; return render() }
    const [t, list] = await Promise.all([
      api('GET', `templates?name=${encodeURIComponent(name)}`),
      api('GET', 'templates').catch(() => []),
    ])
    const listed = (Array.isArray(list) ? list : []).find((x) => x.name === name)
    formTemplate = {
      name: t.name, version: t.version, hash: t.hash, spec: t.spec,
      limits: templateLimits(t.spec), elevated: listed?.elevated || [],
    }
    render()
  }

  async function toggleNotifications(on) {
    if (on && typeof Notification !== 'undefined' && Notification.permission !== 'granted') {
      const answer = await Notification.requestPermission()
      if (answer !== 'granted') on = false
    }
    try { localStorage.setItem(NOTIFY_KEY, on ? 'on' : 'off') } catch { /* nothing to remember it in */ }
    toast(on ? 'Desktop notifications on while this tab is open' : 'Desktop notifications off')
    render()
  }

  /** The bar appears only when something is ticked, and counts what is. */
  function syncBulkBar() {
    const bar = document.getElementById('bulkBar')
    if (!bar) return
    const n = document.querySelectorAll('.bulk-pick:checked').length
    bar.hidden = n === 0
    const count = document.getElementById('bulkCount')
    if (count) count.textContent = String(n)
  }

  document.addEventListener('change', (e) => {
    const box = e.target
    if (['sApproval', 'sMethods', 'sLifetime'].includes(box?.id)) return syncSessionWarnings()
    if (box?.id === 'sCred') return syncSpendBox()
    if (box?.id === 'sTemplate') return chooseTemplate(box.value).catch((err) => toast(err.message))
    if (box?.id === 'notifyToggle') return toggleNotifications(box.checked).catch((err) => toast(err.message))
    if (!box.classList?.contains('bulk-pick')) return
    if (box.checked) selected.add(box.dataset.id)
    else selected.delete(box.dataset.id)
    syncBulkBar()
  })

  document.addEventListener('click', async (e) => {
    const navBtn = e.target.closest('nav button[data-view]')
    if (navBtn) {
      current = navBtn.dataset.view
      syncNav()
      return render()
    }
    if (e.target.id === 'lockBtn') {
      try {
        if (vaultLocked) {
          await actions.unlock()
        } else {
          if (!confirm('Lock the vault? Every proxied request is refused until it is unlocked.')) return
          await gated({ op: 'vault.lock' }, (proof) => api('POST', 'lock', { presence: proof }))
          toast('Vault locked')
          render()
        }
      } catch (err) { toast(err.message) }
      return
    }
    const docBtn = e.target.closest('[data-doc]')
    if (docBtn) {
      docsSection = docBtn.dataset.doc
      syncNav()
      return render()
    }
    const copyBtn = e.target.closest('[data-copy]')
    if (copyBtn) {
      try {
        await navigator.clipboard.writeText(copyBtn.dataset.copy)
        copyBtn.textContent = 'Copied'
        setTimeout(() => { copyBtn.textContent = 'Copy' }, 1400)
      } catch { toast('Your browser would not let the page copy. Select the text instead.') }
      return
    }
    const actBtn = e.target.closest('[data-act]')
    if (actBtn && actions[actBtn.dataset.act]) {
      try { await actions[actBtn.dataset.act](actBtn) } catch (err) { toast(err.message) }
    }
  })

  /**
   * Which cards are ticked, kept outside the DOM.
   *
   * The approvals view re-renders every five seconds so new requests appear.
   * That wiped the selection: tick six, pause to read one, and they are all
   * clear again before you look up. Nobody would have noticed from the tests -
   * every one of them passed - and nobody would have trusted the feature after
   * using it twice.
   */
  const selected = new Set()

  function restoreSelection() {
    const boxes = [...document.querySelectorAll('.bulk-pick')]
    if (!boxes.length) return
    // An item that is no longer pending drops out of the selection with it, so
    // a tick cannot outlive the thing it was about.
    const present = new Set(boxes.map((b) => b.dataset.id))
    for (const id of [...selected]) if (!present.has(id)) selected.delete(id)
    for (const box of boxes) box.checked = selected.has(box.dataset.id)
    syncBulkBar()
  }

  /**
   * What the human has typed or chosen on a card — a narrowing, an owner
   * option — kept outside the DOM for the same reason as the selection: the
   * five-second re-render wiped it, so a narrowing half typed was gone, and an
   * approval could go out wider than the one being written.
   */
  const drafts = new Map()
  const DRAFTED = '.narrow-input, .owner-approval, .owner-infinite'
  const draftKey = (input) => {
    const card = input.closest('[data-for]')
    return card ? `${card.dataset.for}|${input.dataset.field || input.className}` : null
  }
  function rememberDraft(input) {
    if (!input?.matches?.(DRAFTED)) return
    const key = draftKey(input)
    if (key) drafts.set(key, input.type === 'checkbox' ? input.checked : input.value)
  }
  document.addEventListener('input', (e) => rememberDraft(e.target))
  document.addEventListener('change', (e) => rememberDraft(e.target))
  function restoreDrafts() {
    for (const input of document.querySelectorAll(DRAFTED)) {
      const key = draftKey(input)
      if (!drafts.has(key)) continue
      if (input.type === 'checkbox') input.checked = drafts.get(key)
      else input.value = drafts.get(key)
    }
  }

  async function render() {
    try {
      el.innerHTML = await views[current]()
      restoreSelection()
      restoreDrafts()
      restoreDetails()
      highlightFocus()
    } catch (err) {
      el.innerHTML = `<header class="page"><h1>Cannot reach the daemon</h1></header>
        <p class="sub">${esc(err.message)}</p>
        <div class="card"><div class="body">Start it with <code>agent-vault daemon</code>, or check
        <code>agent-vault status</code>.</div></div>`
    }
    await refreshChrome()
  }

  /** Keep the sidebar telling the truth, whichever view is open. */
  async function refreshChrome() {
    try {
      const state = await api('GET', 'lockstate')
      vaultLocked = state.locked
      const btn = document.getElementById('lockBtn')
      btn.textContent = vaultLocked ? 'Unlock vault' : 'Lock vault'
      btn.className = vaultLocked ? 'action primary' : 'action danger'
      btn.title = vaultLocked
        ? 'Every proxied request is refused until you unlock'
        : 'Refuse every proxied request until you unlock'
    } catch { /* the main panel already reports an unreachable daemon */ }

    try {
      const pending = await api('GET', 'pending')
      const badge = document.getElementById('approvalCount')
      badge.textContent = pending.length ? ` (${pending.length})` : ''
      badge.className = pending.length ? 'pill warn' : ''
      notifyNew(pending)
    } catch { /* the error is already shown in the main panel */ }
  }

  /** Keep the sidebar and the address bar agreeing with what is on screen. */
  function syncNav() {
    document.querySelectorAll('nav button[data-view]').forEach((b) =>
      b.setAttribute('aria-current', String(b.dataset.view === current)))
    const want = current === 'docs' ? `#docs/${docsSection}`
      : current === 'approvals' && focusItem ? `#approvals/${encodeURIComponent(focusItem)}` : `#${current}`
    if (location.hash !== want) history.replaceState(null, '', want)
  }

  syncNav()
  render()
  timer = setInterval(() => {
    if (current === 'approvals' || current === 'overview') render()
    else refreshChrome()
  }, 5000)
})()
</script>
