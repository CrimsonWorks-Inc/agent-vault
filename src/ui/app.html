<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-vault</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><mask id='k'><rect width='64' height='64' fill='%23fff'/><circle cx='32' cy='25' r='8.5'/><path d='M28.8 31L24.5 45.5A2.5 2.5 0 0 0 27 48L37 48A2.5 2.5 0 0 0 39.5 45.5L35.2 31Z'/></mask><style>.b%7Bfill:%231d6a86%7D%40media(prefers-color-scheme:dark)%7B.b%7Bfill:%2364b6d2%7D%7D</style><rect class='b' width='64' height='64' rx='15' mask='url(%23k)'/></svg>">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f8;
    --panel: #ffffff;
    --ink: #16202a;
    --muted: #5f707c;
    --line: #d9e0e5;
    --accent: #1d6a86;
    --accent-soft: #e3eff4;
    --ok: #2c7a4b;
    --warn: #a86a12;
    --crit: #ab2e26;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161a; --panel: #161f25; --ink: #e2e9ed; --muted: #90a1ac;
      --line: #263139; --accent: #64b6d2; --accent-soft: #14303a;
      --ok: #62bf89; --warn: #dfa54a; --crit: #e97a70;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 208px 1fr; min-height: 100vh;
  }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; } nav { position: static !important; } }

  nav {
    background: var(--panel); border-right: 1px solid var(--line);
    padding: 18px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  /* Deliberately not a flex container: the mark stands in for the hyphen, so
     it belongs in the text flow like a glyph. As a flex item with width auto
     an SVG has no intrinsic width and collapses to zero, which left the two
     halves of the word with nothing between them. */
  .brand {
    padding: 2px 8px 16px; font-size: 15px;
    font-weight: 650; letter-spacing: -.012em; white-space: nowrap;
  }
  /* Both axes in em so the lockup scales with the word. The width is the
     viewBox ratio (18 / 33.5) applied to the height, and vertical-align seats
     it against the letters the way a hyphen sits. */
  .brand .mark {
    display: inline-block; height: .82em; width: .44em;
    margin: 0 .17em; vertical-align: -.1em; color: var(--accent);
  }
  nav button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 7px 10px; border-radius: 7px; color: var(--ink); font: inherit; cursor: pointer;
  }
  nav button:hover { background: var(--bg); }
  nav button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav .foot { margin-top: 18px; padding: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }

  main { padding: 32px 34px 64px; max-width: 1000px; }

  /* The page title has to outrank the small-caps card labels below it. At 19px
     it did not, so the eye landed on CONFIRMATION before Overview. */
  header.page {
    display: flex; align-items: center; gap: 10px;
    margin: 0 0 7px; min-height: 30px;
  }
  header.page h1 {
    font-size: 23px; line-height: 1.15; margin: 0;
    font-weight: 650; letter-spacing: -.022em;
  }
  /* Baseline-aligning a pill against a 23px cap height drops it below the
     title; centring and a hair of optical offset sits it right. */
  header.page .pill { transform: translateY(0.5px); flex-shrink: 0; }
  .sub {
    color: var(--muted); margin: 0 0 24px;
    max-width: 72ch; font-size: 13.5px; line-height: 1.5;
  }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
  /* Small caps at 700 read as shouting next to a proper title; 600 is enough
     to separate the label from the rows under it. */
  .card > h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .075em;
               font-weight: 600; color: var(--muted);
               margin: 0; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .card > .body { padding: 14px 16px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 11px 16px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .main { min-width: 0; }
  .row .name { font-weight: 600; }
  .row .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; word-break: break-word; }
  .empty { padding: 22px 16px; color: var(--muted); }

  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  .pill { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase;
          letter-spacing: .05em; padding: 2px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .pill.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .pill.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .pill.crit { background: color-mix(in srgb, var(--crit) 15%, transparent); color: var(--crit); }

  button.action {
    font: inherit; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); cursor: pointer;
  }
  button.action:hover { border-color: var(--accent); color: var(--accent); }
  button.action.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.action.danger:hover { border-color: var(--crit); color: var(--crit); }
  .actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select {
    font: inherit; width: 100%; padding: 7px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  /* The rule above is for form FIELDS, which are full width by design. A
     checkbox inheriting width:100% stretched across the whole card with its
     label shoved to the far edge - every test passed and the page was visibly
     broken, which is what looking at it is for. */
  input[type="checkbox"] {
    width: auto; flex: none; margin: 0; padding: 0;
    accent-color: var(--accent); cursor: pointer;
  }
  .pick { display: flex; gap: 8px; align-items: center; cursor: pointer; width: fit-content; }
  .pick span { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 12px; }

  .notice { border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent);
            padding: 10px 14px; border-radius: 0 7px 7px 0; margin-bottom: 18px; color: var(--ink); font-size: 13px; }
  .audit { font-family: var(--mono); font-size: 12px; }
  .audit .line { display: grid; grid-template-columns: 62px 58px 190px 1fr; gap: 10px; padding: 4px 16px; }
  .audit .line:nth-child(odd) { background: color-mix(in srgb, var(--ink) 3%, transparent); }
  .t-allow { color: var(--ok); } .t-deny { color: var(--crit); } .t-dim { color: var(--muted); }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(360px, 90vw);
           display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  .modal label { font-weight: 600; color: var(--ink); margin: 0; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  /* --- docs ------------------------------------------------------------- */
  .docnav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .docnav button {
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  }
  .docnav button:hover { color: var(--accent); border-color: var(--accent); }
  .docnav button[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .prose { max-width: 68ch; }
  .prose p { margin: 0 0 12px; }
  /* These were set at body size, so only the weight marked them as headings
     and a scanning eye slid straight past them. */
  .prose h3 {
    font-size: 15.5px; font-weight: 650; line-height: 1.3;
    margin: 26px 0 9px; letter-spacing: -.015em; color: var(--ink);
  }
  .prose h3:first-child { margin-top: 0; }
  .prose ul { margin: 0 0 12px; padding-left: 20px; }
  .prose li { margin-bottom: 5px; }
  .prose code { background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 4px; }
  .prose strong { font-weight: 650; }
  .prose a { color: var(--accent); }

  .cmd { position: relative; margin: 0 0 14px; max-width: 68ch; }
  .cmd pre {
    margin: 0; padding: 11px 44px 11px 14px; overflow-x: auto;
    background: color-mix(in srgb, var(--ink) 5%, var(--panel));
    border: 1px solid var(--line); border-radius: 8px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
  }
  .cmd .copy {
    position: absolute; top: 7px; right: 7px; font: inherit; font-size: 11px;
    padding: 3px 8px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
  }
  .cmd .copy:hover { color: var(--accent); border-color: var(--accent); }
  .cmd .caption { color: var(--muted); font-size: 12.5px; margin: 0 0 5px; }

  table.codes { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.codes th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
                   color: var(--muted); font-weight: 600; padding: 0 12px 7px 0; }
  table.codes td { padding: 8px 12px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  table.codes td:first-child { font-family: var(--mono); font-size: 12px; color: var(--crit); white-space: nowrap; }

  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
           background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: 8px;
           font-size: 13px; opacity: 0; transition: opacity .18s; pointer-events: none; }
  #toast.show { opacity: 1; }

  /* --- wave 3 ----------------------------------------------------------- */
  /* A class that sets display (.grid) beats the hidden attribute's own rule,
     which showed the spend limits for a credential that has no spend. */
  [hidden] { display: none !important; }
  details.more { border-bottom: 1px solid var(--line); padding: 8px 16px; }
  details.more:last-child { border-bottom: 0; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
  details.preview { margin: 8px 0 10px; }
  /* Agent-written bytes, set apart so they never read as the page's own words. */
  pre.untrusted {
    font-family: var(--mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
    background: color-mix(in srgb, var(--warn) 6%, var(--panel)); border: 1px dashed var(--warn);
    border-radius: 7px; padding: 8px 10px; max-height: 320px; overflow: auto; margin: 6px 0;
  }
  .chip { display: inline-block; font-family: var(--mono); font-size: 11.5px; padding: 1px 7px;
          border-radius: 999px; border: 1px solid var(--line); margin: 2px 4px 2px 0; }
  table.kv { border-collapse: collapse; font-size: 12.5px; width: 100%; margin: 6px 0; }
  table.kv td { padding: 3px 10px 3px 0; vertical-align: top; border-top: 1px solid var(--line); word-break: break-word; }
  table.kv td:first-child { color: var(--muted); white-space: nowrap; width: 1%; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; margin: 4px 0 8px; }
  .bar span { position: absolute; top: 0; bottom: 0; left: 0; }
  .bar .used { background: var(--accent); }
  .bar .reserved { background: var(--warn); }
  .highlight { outline: 2px solid var(--warn); outline-offset: 2px; }
  .actions { flex-wrap: wrap; justify-content: flex-end; }
  button.action.panic { background: var(--crit); border-color: var(--crit); color: #fff; }
  textarea {
    font: inherit; font-family: var(--mono); font-size: 12px; width: 100%; min-height: 70px;
    padding: 7px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .routes .route { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .modal { width: min(440px, 92vw); }
</style>

<nav>
  <!-- The keyhole stands in for the hyphen, so the mark is part of the word
       rather than an icon parked beside it. The viewBox is cropped to the
       glyph's own bounds; the 0 0 64 64 box used by the icon and the favicon
       would surround it with padding and float it away from the letters.
       The path itself is identical, so the two forms cannot drift. -->
  <div class="brand" aria-label="agent-vault">agent<svg class="mark" viewBox="23 15.5 18 33.5"
      aria-hidden="true" fill="currentColor"><circle cx="32" cy="25" r="8.5"/><path
      d="M28.8,31 L24.5,45.5 A2.5,2.5 0 0 0 27,48 L37,48 A2.5,2.5 0 0 0 39.5,45.5 L35.2,31 Z"/></svg>vault</div>
  <button data-view="overview" aria-current="true">Overview</button>
  <button data-view="credentials">Credentials</button>
  <button data-view="sessions">Sessions</button>
  <button data-view="approvals">Approvals <span id="approvalCount"></span></button>
  <button data-view="audit">Audit</button>
  <button data-view="docs">Docs</button>
  <div class="foot">
    No credential value is ever sent to this page, and every change needs a
    fingerprint.
    <div style="margin-top:8px"><button class="action danger" id="lockBtn" style="width:100%">Lock vault</button></div>
  </div>
</nav>

<main>
  <div id="view"></div>
</main>
<div id="toast" role="status"></div>

<script>
(() => {
  const el = document.getElementById('view')
  const toastEl = document.getElementById('toast')
  // The fragment survives the launch-token redirect, so a link can open a
  // particular page: /#docs, or /#docs/connect for one section of it.
  const [hashView, hashSection] = (location.hash || '').replace(/^#/, '').split('/')
  let current = hashView || 'overview'
  let timer = null

  const api = async (method, path, body) => {
    const res = await fetch(`/api/${path}`, {
      method,
      headers: { 'x-av-ui': '1', ...(body ? { 'content-type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
      credentials: 'same-origin',
    })
    const data = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(data.error || `request failed (${res.status})`)
    return data
  }

  // --- presence -----------------------------------------------------------
  // Everything that changes capability goes through here. The challenge comes
  // from the daemon and is derived from the operation, so the signature cannot
  // be replayed against a different action. An automated browser reaches the
  // platform dialog and stops there.
  const b64uToBuf = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0))
  const bufToB64u = (b) => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
  const bufToB64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)))
  const b64ToBuf = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))

  // --- Touch ID unlock, via the WebAuthn PRF extension ---------------------
  // PRF returns a stable 32-byte secret from the authenticator for our salt,
  // which the daemon uses to unwrap the vault key. Only a real Touch ID can
  // produce it, so it is a cryptographic factor, not just a presence tap.
  function prfSupported() { return typeof PublicKeyCredential !== 'undefined' }

  async function touchIdUnlock() {
    const p = await api('GET', 'unlock/webauthn-params')
    const salt = b64ToBuf(p.prf_salt)
    let assertion
    try {
      assertion = await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ id: b64uToBuf(p.credential_id), type: 'public-key' }],
          userVerification: 'required', rpId: p.rp_id, timeout: 60000,
          extensions: { prf: { eval: { first: salt } } },
        },
      })
    } catch (e) {
      if (e.name === 'NotAllowedError') throw new Error('Touch ID was not confirmed.')
      throw e
    }
    const prf = assertion.getClientExtensionResults()?.prf?.results?.first
    if (!prf) throw new Error('This browser did not return a PRF secret. Use your passphrase to unlock.')
    return api('POST', 'unlock/touchid', { prf_secret: bufToB64(prf) })
  }

  // The daemon refuses Touch ID unlock on a vault with no passphrase (rule
  // factor_order), because the passphrase is the recovery factor. The page
  // says the same thing, in the daemon's words, before anyone taps.
  const TOUCHID_NEEDS_PASSPHRASE = 'Touch ID unlock needs a passphrase to fall back on if the authenticator is lost. Set one, then enable Touch ID unlock again: agent-vault passphrase set'

  async function enableTouchId() {
    const params = await api('GET', 'touchid/enroll-params')
    if (!params.has_passphrase) throw new Error(TOUCHID_NEEDS_PASSPHRASE)
    const salt = b64ToBuf(params.prf_salt)
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: { id: params.rp_id, name: 'agent-vault' },
        user: { id: new TextEncoder().encode('agent-vault-unlock'), name: 'vault-unlock', displayName: 'Vault unlock' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        extensions: { prf: { eval: { first: salt } } },
        timeout: 120000, attestation: 'none',
      },
    })
    let prf = cred.getClientExtensionResults()?.prf?.results?.first
    if (!prf) {
      // Some authenticators only evaluate PRF on assertion; follow up with one.
      const asrt = await navigator.credentials.get({
        publicKey: {
          challenge: crypto.getRandomValues(new Uint8Array(32)),
          allowCredentials: [{ id: cred.rawId, type: 'public-key' }],
          userVerification: 'required', rpId: params.rp_id, timeout: 60000,
          extensions: { prf: { eval: { first: salt } } },
        },
      })
      prf = asrt.getClientExtensionResults()?.prf?.results?.first
    }
    if (!prf) throw new Error('This browser or Mac does not support the WebAuthn PRF extension, so Touch ID unlock is not available here. Your passphrase still works.')
    // Signed over what is sent. A bare { op } bound nothing, and the servers
    // compare against the whole request, so it never verified.
    const body = { credential_id: bufToB64u(cred.rawId), prf_secret: bufToB64(prf) }
    await gated(await operationFor('touchid.enroll', body), (proof) =>
      api('POST', 'touchid/enroll', { ...body, presence: proof }))
  }

  /**
   * The operation a signature will authorise, built from the whole request.
   *
   * It used to be a hand-picked few fields, and the ones nobody picked were
   * the dangerous ones: a signature for "session.create on demo, GET, /**"
   * did not cover approval, budget, ttl or remote. The server rebuilds this
   * from the request it receives and compares, so anything missing here is a
   * field that could be changed after you touched the sensor.
   */
  async function operationFor(op, params) {
    const out = { op }
    for (const key of Object.keys(params).sort()) {
      const v = params[key]
      if (v === undefined || key === 'presence') continue
      // The secret-bearing fields the servers bind by digest (DIGESTED in
      // webauthn.js). A string is its own bytes; anything else its canonical
      // form, which is how the servers digest it too.
      if (DIGESTED.includes(key)) {
        const text = typeof v === 'string' ? v : canonicalJson(v)
        const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text))
        out[`${key}_sha256`] = [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('')
        continue
      }
      out[key] = v
    }
    return out
  }
  const DIGESTED = ['value', 'prf_secret', 'recovery_passphrase', 'bundle', 'webhook_url']

  /** Sorted keys, undefined dropped: canonicalOperation in webauthn.js. */
  function canonicalJson(value) {
    if (value === null || typeof value !== 'object') return JSON.stringify(value ?? null)
    if (Array.isArray(value)) return `[${value.map(canonicalJson).join(',')}]`
    const keys = Object.keys(value).filter((k) => value[k] !== undefined).sort()
    return `{${keys.map((k) => `${JSON.stringify(k)}:${canonicalJson(value[k])}`).join(',')}}`
  }

  let presenceState = { enrolled: false }
  let vaultLocked = false

  async function refreshPresence() {
    try { presenceState = await api('GET', 'presence/state') } catch { presenceState = { enrolled: false } }
    return presenceState
  }

  /**
   * Enrolling is the one change a fingerprint cannot authorise, because the
   * fingerprint being enrolled is the thing in question. When a passphrase
   * exists, the daemon wants it once, here, and never again for this device.
   */
  async function enroll() {
    const ls = await api('GET', 'lockstate').catch(() => ({}))
    // Sent with the enrolment rather than used to open a window: a window
    // would let anything else on the control socket enrol a key of its own
    // while it was open.
    let passphrase
    if (ls.has_passphrase) {
      passphrase = await askSecret('Vault passphrase, to enrol this device')
      if (passphrase == null) throw new Error('Cancelled. Nothing was enrolled.')
    }
    const opts = await api('POST', 'presence/enroll/begin')
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: b64uToBuf(opts.challenge),
        rp: opts.rp,
        user: { id: b64uToBuf(opts.user.id), name: opts.user.name, displayName: opts.user.displayName },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: {
          authenticatorAttachment: 'platform',
          userVerification: 'required',
          residentKey: 'preferred',
        },
        timeout: 120000,
        attestation: 'none',
      },
    })
    await api('POST', 'presence/enroll/finish', {
      attestationObject: bufToB64u(cred.response.attestationObject),
      clientDataJSON: bufToB64u(cred.response.clientDataJSON),
      passphrase,
    })
    await refreshPresence()
  }

  /** Obtain a signature for one specific operation. */
  async function presence(operation) {
    const ch = await api('POST', 'presence/challenge', { operation })
    const assertion = await navigator.credentials.get({
      publicKey: {
        challenge: b64uToBuf(ch.challenge),
        allowCredentials: ch.allowCredentials.map((c) => ({ id: b64uToBuf(c.id), type: 'public-key' })),
        userVerification: 'required',
        rpId: ch.rpId,
        timeout: 60000,
      },
    })
    return {
      challengeId: ch.challengeId,
      credentialId: bufToB64u(assertion.rawId),
      authenticatorData: bufToB64u(assertion.response.authenticatorData),
      clientDataJSON: bufToB64u(assertion.response.clientDataJSON),
      signature: bufToB64u(assertion.response.signature),
    }
  }

  /** Run a gated action: sign the operation, then send it with the signature. */
  async function gated(operation, send) {
    if (!presenceState.enrolled) {
      throw new Error('No authenticator enrolled. Set one up from the Overview tab first.')
    }
    let proof
    try {
      proof = await presence(operation)
    } catch (e) {
      if (e.name === 'NotAllowedError') throw new Error('Not confirmed. Nothing was changed.')
      throw e
    }
    return send(proof)
  }

  // clear text, which is exactly what this app must not do.
  function askSecret(label) {
    return new Promise((resolve) => {
      const back = document.createElement('div')
      back.className = 'modal-back'
      back.innerHTML = `<form class="modal">
        <label for="secretField">${esc(label)}</label>
        <input id="secretField" type="password" autocomplete="current-password" spellcheck="false" autofocus>
        <div class="modal-actions">
          <button type="button" class="action" data-x="cancel">Cancel</button>
          <button type="submit" class="action primary">Unlock</button>
        </div>
      </form>`
      document.body.appendChild(back)
      const field = back.querySelector('#secretField')
      const close = (val) => { back.remove(); resolve(val) }
      back.querySelector('[data-x="cancel"]').onclick = () => close(null)
      back.onclick = (e) => { if (e.target === back) close(null) }
      back.querySelector('.modal').onsubmit = (e) => { e.preventDefault(); close(field.value) }
      document.addEventListener('keydown', function esc(e) {
        if (e.key === 'Escape') { document.removeEventListener('keydown', esc); close(null) }
      })
      setTimeout(() => field.focus(), 20)
    })
  }

    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000)
    if (s < 60) return `${Math.floor(s)}s ago`
    if (s < 3600) return `${Math.floor(s / 60)}m ago`
    return `${Math.floor(s / 3600)}h ago`
  }

    const s = (Date.parse(iso) - Date.now()) / 1000
    if (!Number.isFinite(s) || s <= 0) return 'expired'
    if (s < 3600) return `${Math.floor(s / 60)}m left`
    return `${Math.floor(s / 3600)}h left`
  }

  // ------------------------------------------------------- session handoff
  // What to give the agent, shown once after a session is created. None of it
  // is a secret: the token and the placeholder are capabilities the agent is
  // about to hold anyway, and neither can be turned back into a credential.
  // Withholding them only meant a session made here could not be used.

  let lastSession = null

  /**
   * A curl line that puts the placeholder where this credential declares it
   * goes. Anywhere else and the daemon refuses with AV_BAD_LOCATION, so a
   * generic example would be an example of the error.
   */
  // Narrowing typed into the approvals page is read by the CLI's own parser,
  // parseOverrides from src/pending.js, which the UI server puts here when it
  // serves the page. A copy kept in the page was a second reader, and the
  // server rebuilds the signed operation with the first (contract C21).
  /* parseOverrides: injected by src/ui/server.js from src/pending.js */

  const SAFE_METHODS = ['GET', 'HEAD', 'OPTIONS']
  /** Auto with any method that writes: the session never asks you again. */
  const autoWrites = (approval, methods) =>
    approval === 'auto' && (methods || ['GET', 'HEAD']).some((m) => !SAFE_METHODS.includes(String(m).toUpperCase()))
  /** The name a tool most likely reads a credential from. */
  const suggestedName = (g) => g.env?.key || `${String(g.cred).toUpperCase().replace(/[^A-Z0-9]/g, '_')}_TOKEN`

  function exampleCall(s) {
    const site = (s.sites || [])[0] || ''
    const [kind, name, scheme] = site.split(':')
    // The token goes in AV-Session. For a Bearer-site credential the
    // placeholder goes in Authorization, and of two Authorization headers a
    // server keeps the first — so the example dropped the placeholder.
    const auth = `  -H "AV-Session: ${s.token}"`
    if (kind === 'header') {
      const header = `${name}: ${scheme ? `${scheme} ` : ''}${s.placeholder}`
      return `curl "${s.base_url}${s.probe || '/'}" \\\n${auth} \\\n  -H "${header}"`
    }
    // Non-header sites (basic auth, a form field, a JSON pointer) do not fit a
    // one-liner; the usage list above is the authoritative answer.
    return `curl "${s.base_url}${s.probe || '/'}" \\\n${auth}\n\n# then put the placeholder at: ${site}`
  }

  function handoffCard() {
    if (!lastSession) return ''
    const s = lastSession
    const grants = s.grants || [s]
    const curl = exampleCall({ ...grants[0], token: s.token, sites: s.sites, probe: s.probe })
    // Names a tool reads, mapped to credentials. The command writes
    // placeholders and loopback URLs only; the session token is not in it.
    const envCmd = `${s.cli} env --session ${s.session_id} --out .env ${grants.map((g) => `--map ${suggestedName(g)}=${g.cred}`).join(' ')}`
    return `
      <div class="card"><h2>Hand this to the agent</h2><div class="body">
        <p class="caption">Session <span class="mono">${esc(s.session_id)}</span>, ${esc(s.infinite ? 'never expires' : until(s.expires_at))}.
          Shown once here — reload and it is gone from this page. It is saved to
          <span class="mono">~/.agent-vault/cli-state.json</span>, which is where the CLI and the
          MCP bridge look for it.</p>
        ${codeRow('Session token', s.token)}
        ${grants.map((g) => `
          <h3 class="mono" style="margin:16px 0 6px">${esc(g.cred)}</h3>
          ${codeRow('Base URL', g.base_url)}
          ${codeRow('Placeholder', g.placeholder)}
          <p class="caption" style="margin-top:10px">The placeholder goes here, and nowhere else:</p>
          <ul class="prose" style="margin-bottom:10px">${(g.usage || []).map((u) => `<li><code>${esc(u)}</code></li>`).join('')}</ul>
          ${(g.lint || []).length ? `<div class="notice">${(g.lint || []).map((p) => esc(p.message ?? p)).join('<br>')}</div>` : ''}`).join('')}
        <p class="caption" style="margin-top:14px">An env file for your tools: placeholders only, written readable by you alone.</p>
        ${code(envCmd)}
        <p class="caption">A request that exercises the first one:</p>
        ${code(curl)}
        <button class="action" data-act="dismiss-handoff">Done</button>
      </div></div>`
  }

  const codeRow = (label, value) => `
    <div class="cmd"><p class="caption">${esc(label)}</p>
      <pre>${esc(value)}</pre><button class="copy" data-copy="${esc(value)}">Copy</button></div>`

  // ------------------------------------------------------ wave-3 renderers
  // Pure: each takes what a route returned and gives back HTML or text, so
  // the tests can run them as they are written here. Anything that came from
  // an agent goes through esc(), in monospace, under a label that says so.

  const UNTRUSTED = 'written by the agent, not verified'

  /**
   * What a held request sends, as the gateway previewed it (F13). The
   * gateway has already put labels where placeholders were and scrubbed any
   * secret; this paints it, and decides nothing.
   */
  function previewBlock(p, id = '') {
    if (!p || typeof p !== 'object') return ''
    const body = p.body && typeof p.body === 'object' ? p.body : {}
    const pairs = (list, where) => (Array.isArray(list) ? list : [])
      .filter((x) => Array.isArray(x)).map(([k, v]) => [where, k, v])
    const rows = [...pairs(p.query, 'query'), ...pairs(p.headers, 'header')]
    const chips = (Array.isArray(p.placeholders) ? p.placeholders : [])
      .map((x) => `<span class="chip">${esc(x?.label)} @ ${esc(x?.location)}</span>`).join('')
    const text = typeof body.text === 'string'
      ? `<pre class="untrusted">${esc(body.text)}</pre>`
      : `<div class="meta">${body.kind === 'binary' ? 'A binary body, not shown.' : 'No body.'}</div>`
    return `<details class="preview" data-keep="preview:${esc(id)}"><summary>What it sends (${UNTRUSTED})</summary>
      <div class="meta mono">${esc(p.method)} ${esc(p.host)}${esc(p.path)}
        &middot; ${esc(p.content_type || 'no content type')} &middot; ${esc(Number.isInteger(body.bytes) ? body.bytes : 0)} bytes${body.truncated === true ? `, first ${esc(body.shown_bytes)} shown` : ''}</div>
      ${text}
      ${rows.length ? `<table class="kv">${rows.map(([where, k, v]) =>
        `<tr><td>${esc(where)}</td><td class="mono">${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join('')}</table>` : ''}
      ${chips ? `<div class="meta" style="margin-top:6px">Placeholders: ${chips}</div>` : ''}
    </details>`
  }

  /**
   * A desktop notification's text (F14): the daemon's headline, never the
   * agent's reason, with control characters out and cut to 120 characters,
   * as the CLI's `watch` writes it.
   */
  function notificationText(item) {
    const lead = item?.kind === 'request' ? 'Held request: ' : 'Session requested: '
    const text = `${lead}${String(item?.headline ?? '')}`.replace(/[\u0000-\u001f\u007f-\u009f]/g, ' ')
    return text.length > 120 ? `${text.slice(0, 119)}…` : text
  }

  /** Pills for what a human should notice about a credential (F10, F16). */
  function credentialBadges(c) {
    const out = []
    if (c?.quarantine) out.push('<span class="pill crit">quarantined</span>')
    if (c?.expiry_warning === 'expired') out.push('<span class="pill crit">expired</span>')
    else if (c?.expiry_warning === 'soon') out.push(`<span class="pill warn">${esc(expiresIn(soonestExpiry(c)))}</span>`)
    const status = c?.health?.status
    if (status === 'ok') out.push('<span class="pill ok">healthy</span>')
    else if (typeof status === 'string' && status !== 'unknown') out.push(`<span class="pill warn">${esc(status)}</span>`)
    return out.join(' ')
  }

  /** The earlier of the expiry you set and the one the upstream reported. */
  function soonestExpiry(c) {
    const at = [c?.expires_at, c?.health?.observed_expires_at]
      .filter((x) => typeof x === 'string').map((x) => Date.parse(x)).filter(Number.isFinite)
    return at.length ? Math.min(...at) : null
  }

  function expiresIn(ms) {
    if (ms === null) return 'expires soon'
    const days = Math.ceil((ms - Date.now()) / 86_400_000)
    return days <= 0 ? 'expired' : `expires in ${days}d`
  }

  /** `pinned: api.github.com (2)`, read-only: pinning stays in the CLI (F11). */
  function pinsText(pins) {
    const hosts = Object.entries(pins && typeof pins === 'object' ? pins : {})
      .filter(([, n]) => Number.isInteger(n) && n > 0)
    return hosts.length ? `pinned: ${hosts.map(([h, n]) => `${h} (${n})`).join(', ')}` : ''
  }

  /** One effective-policy value in words, for the detail view and the narrow result. */
  function policyValue(v) {
    if (v === null || v === undefined) return 'none'
    if (Array.isArray(v)) return v.length ? v.map((x) => (typeof x === 'object' ? JSON.stringify(x) : String(x))).join(', ') : 'none'
    if (typeof v === 'object') return JSON.stringify(v)
    return String(v)
  }

  /**
   * An effective policy in the Described shape (F20): the same description
   * the agent gets from vault_describe_access, so the two read one thing.
   */
  function describedTable(e) {
    if (!e || typeof e !== 'object') return ''
    const rows = [
      ['hosts', e.hosts], ['methods', e.methods], ['paths', e.paths], ['denied paths', e.deny_paths],
      ['approval', e.approval], ['routes', (e.routes || []).map((set) => (set || []).map((r) => `${(r.methods || []).join(',')} ${(r.paths || []).join(' ')}`).join(' | '))],
      ['budget', e.budget?.invalid ? 'invalid: every request is refused' : e.budget?.limit],
      ['spend', e.spend], ['rate', e.rate ? `${e.rate.count}/${e.rate.per}` : null],
      ['concurrency', e.max_concurrent], ['quota', e.quota ? `${e.quota.count}/${e.quota.window}` : null],
      ['redirects', e.redirects?.max ?? 0],
    ]
    const payload = Array.isArray(e.payload) && e.payload.length
      ? `<tr><td>payload</td><td><pre class="untrusted">${esc(JSON.stringify(e.payload, null, 2))}</pre></td></tr>` : ''
    return `<table class="kv">${rows.map(([k, v]) =>
      `<tr><td>${esc(k)}</td><td class="mono">${esc(policyValue(v))}</td></tr>`).join('')}${payload}</table>`
  }

  /** Used against limit, with what is reserved in between (F5). */
  function spendBar(used, reserved, limit) {
    if (!Number.isFinite(limit) || limit <= 0) return ''
    const pct = (n) => Math.max(0, Math.min(100, (n / limit) * 100)).toFixed(1)
    return `<div class="bar"><span class="reserved" style="width:${pct(used + reserved)}%"></span><span class="used" style="width:${pct(used)}%"></span></div>`
  }

  /** What a narrow changed, grant by grant, from the route's before and after (F15). */
  function narrowSummary(r) {
    const grants = Array.isArray(r?.grants) ? r.grants : []
    const lines = grants.map((g) => {
      const keys = [...new Set([...Object.keys(g.before || {}), ...Object.keys(g.after || {})])]
      const changed = keys.filter((k) => canonicalJson(g.before?.[k]) !== canonicalJson(g.after?.[k]))
      return `<div class="row"><div class="main"><div class="name mono">${esc(g.cred)}</div>
        <div class="meta">${changed.length
          ? changed.map((k) => `${esc(k)}: ${esc(policyValue(g.before?.[k]))} &rarr; ${esc(policyValue(g.after?.[k]))}`).join('<br>')
          : 'already that narrow; nothing changed'}${g.expires_at ? `<br>grant expires ${esc(g.expires_at)}` : ''}</div></div></div>`
    })
    const ends = r?.infinite === true ? 'never expires' : r?.expires_at ? `expires ${r.expires_at}` : ''
    return `${ends ? `<div class="row"><div class="main"><div class="meta">session ${esc(r.session_id)} ${esc(ends)}</div></div></div>` : ''}${lines.join('')}`
  }

  /** `session show`, as a card (F19). */
  function detailCard(d) {
    const s = d?.session || {}
    const a = d?.activity || {}
    const kv = (rows) => `<table class="kv">${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="mono">${esc(v)}</td></tr>`).join('')}</table>`
    const grants = (Array.isArray(d?.grants) ? d.grants : []).map((g) => {
      const sp = g.spend || null
      const lim = g.limits || {}
      return `<div class="body" style="border-top:1px solid var(--line)">
        <div class="name mono">${esc(g.cred)} <span class="pill ${g.state === 'active' ? 'ok' : ''}">${esc(g.state)}</span>
          ${g.expires_at ? `<span class="meta">grant ${esc(until(g.expires_at))}</span>` : ''}</div>
        ${describedTable(g.effective)}
        ${kv([
          ['budget', g.budget ? `${policyValue(g.budget.used)} used of ${policyValue(g.budget.limit)}` : 'none'],
          ...(lim.rate ? [['rate now', `${policyValue(lim.rate.tokens_now)} of ${lim.rate.count} per ${lim.rate.per}`]] : []),
          ...(lim.max_concurrent ? [['in flight', `${policyValue(lim.max_concurrent.in_flight)} of ${lim.max_concurrent.limit}`]] : []),
          ...(lim.quota ? [['quota used', `${policyValue(lim.quota.estimate)} of ${lim.quota.count} per ${lim.quota.window}`]] : []),
        ])}
        ${sp && Number.isFinite(sp.limit_tokens) ? `<div class="meta">tokens: ${esc(sp.tokens_used)} used, ${esc(sp.reserved_tokens)} reserved, of ${esc(sp.limit_tokens)}</div>${spendBar(sp.tokens_used, sp.reserved_tokens, sp.limit_tokens)}` : ''}
        ${sp && Number.isFinite(sp.limit_usd_micros) ? `<div class="meta">spend: $${esc((sp.usd_micros_used / 1e6).toFixed(2))} used, $${esc((sp.reserved_usd_micros / 1e6).toFixed(2))} reserved, of $${esc((sp.limit_usd_micros / 1e6).toFixed(2))} (estimate, prices ${esc(sp.prices_version)})</div>${spendBar(sp.usd_micros_used, sp.reserved_usd_micros, sp.limit_usd_micros)}` : ''}
        ${(g.placeholders || []).length ? `<table class="kv">${g.placeholders.map((p) =>
          `<tr><td class="mono">${esc(p.id)}</td><td class="mono">${esc(p.field)} &middot; ${esc(p.uses)}/${esc(p.max_uses ?? '∞')} &middot; ${esc(p.state)}${p.dead_reason ? ` (${esc(p.dead_reason)})` : ''} &middot; ${esc(p.expires_at ? until(p.expires_at) : 'no expiry of its own')}</td></tr>`).join('')}</table>` : ''}
      </div>`
    }).join('')
    const req = a.requests || {}
    const appr = a.approvals || {}
    return `<div class="card"><h2>Session ${esc(s.id)}</h2>
      ${a.complete === false ? `<div class="notice" style="margin:12px 16px">History is incomplete: ${esc(a.note || 'the audit log does not cover the whole session')}. Missing records are not zero activity.</div>` : ''}
      <div class="body">${kv([
        ['label', s.label], ['state', s.state], ['created', s.created_at],
        ['expires', s.infinite === true ? 'never' : s.expires_at], ['last seen', s.last_seen_at || 'never'],
        ['remote', s.remote === true ? 'yes' : 'no'], ['template', s.template || 'none'],
        ['elevated', (s.elevated || []).join(', ') || 'no'],
      ])}</div>
      ${grants}
      <div class="body" style="border-top:1px solid var(--line)">
        <div class="name">Activity</div>
        <div class="meta">${esc(req.allowed ?? 0)} allowed &middot; ${esc(req.denied ?? 0)} refused &middot; ${esc(req.held ?? 0)} held
          &middot; approvals: ${esc(appr.requested ?? 0)} asked, ${esc(appr.granted ?? 0)} granted, ${esc(appr.denied ?? 0)} denied</div>
        ${(a.paths || []).length ? `<table class="kv">${a.paths.map((p) =>
          `<tr><td class="mono">${esc(p.count)}</td><td class="mono">${esc(p.method)} ${esc(p.path)}</td></tr>`).join('')}</table>` : ''}
        ${(a.denials || []).length ? `<table class="kv">${a.denials.map((x) =>
          `<tr><td class="mono">${esc(x.count)}</td><td class="mono">${esc(x.code)} ${esc(x.rule || '')}</td></tr>`).join('')}</table>` : ''}
        ${(a.tripwires || []).length ? `<div class="meta">tripwires: ${a.tripwires.map((t) => `${esc(t.rule_id)} at ${esc(t.at)}`).join(', ')}</div>` : ''}
        <div class="actions" style="margin-top:10px">
          <button class="action" data-copy="${esc(detailMarkdown(d))}">Copy as Markdown</button>
          <button class="action" data-act="close-detail">Close</button>
        </div>
      </div></div>`
  }

  /** The same sections as a Markdown summary, for pasting into a review. */
  function detailMarkdown(d) {
    const s = d?.session || {}
    const a = d?.activity || {}
    const tick = (v) => `\`${String(v ?? '').replace(/`/g, "'")}\``
    const lines = [
      `## Session ${tick(s.id)}${s.label ? ` (${String(s.label).replace(/[\r\n]/g, ' ')})` : ''}`,
      '',
      `- state: ${s.state ?? 'unknown'}`,
      `- expires: ${s.infinite === true ? 'never' : s.expires_at ?? 'unknown'}`,
      `- elevated: ${(s.elevated || []).join(', ') || 'no'}`,
    ]
    if (a.complete === false) lines.push(`- **history incomplete:** ${a.note || 'the audit log does not cover the whole session'}`)
    for (const g of Array.isArray(d?.grants) ? d.grants : []) {
      lines.push('', `### ${tick(g.cred)} (${g.state ?? 'unknown'})`, '')
      const e = g.effective || {}
      for (const k of ['hosts', 'methods', 'paths', 'deny_paths', 'approval', 'rate', 'max_concurrent', 'quota', 'spend']) {
        if (e[k] !== null && e[k] !== undefined) lines.push(`- ${k}: ${tick(policyValue(e[k]))}`)
      }
      if (e.budget) lines.push(`- budget: ${g.budget?.used ?? 0} used of ${e.budget.limit ?? 'unlimited'}`)
      if (g.expires_at) lines.push(`- grant expires: ${g.expires_at}`)
    }
    const req = a.requests || {}
    lines.push('', '### Activity', '', `- ${req.allowed ?? 0} allowed, ${req.denied ?? 0} refused, ${req.held ?? 0} held`)
    for (const p of a.paths || []) lines.push(`- ${p.count} × ${tick(`${p.method} ${p.path}`)}`)
    for (const x of a.denials || []) lines.push(`- refused ${x.count} × ${tick(`${x.code} ${x.rule || ''}`.trim())}`)
    return lines.join('\n')
  }

  /** The access review card on the overview (F19). */
  function accessReview(report) {
    if (!report || typeof report !== 'object') return ''
    const unused = (report.sessions || []).filter((s) => (s.unused_methods || []).length)
    const flagged = (report.credentials || []).filter((c) => c.quarantined === true || c.expiry_warning)
    const rows = [
      ...unused.map((s) => `<div class="row"><div class="main"><div class="name">${esc(s.label || s.id)}</div>
        <div class="meta">granted but never used: <span class="mono">${esc(s.unused_methods.join(', '))}</span> &middot; narrow it to what it uses</div></div></div>`),
      ...flagged.map((c) => `<div class="row"><div class="main"><div class="name mono">${esc(c.slug)}</div>
        <div class="meta">${c.quarantined === true ? 'quarantined' : ''}${c.quarantined === true && c.expiry_warning ? ' &middot; ' : ''}${c.expiry_warning === 'expired' ? 'expired' : c.expiry_warning ? 'expires soon' : ''}</div></div></div>`),
    ]
    return `<div class="card"><h2>Access review (7 days)</h2>
      ${report.complete === false ? '<div class="notice" style="margin:12px 16px">The audit log does not cover the whole period, so this review is incomplete.</div>' : ''}
      ${rows.length ? rows.join('') : '<div class="empty">Nothing to tighten: every granted method was used, and no credential is expiring or quarantined.</div>'}</div>`
  }

  /** `replay  AV_PH_REPLAY  1 in 10m  → revoke_session` */
  function tripwireRuleText(r) {
    const what = (r?.codes || []).length ? r.codes.join(',') : r?.rule_prefix ? `${r.rule_prefix}*` : '?'
    const w = Number(r?.window_s)
    const span = w % 3600 === 0 ? `${w / 3600}h` : w % 60 === 0 ? `${w / 60}m` : `${w}s`
    return `${r?.id}  ${what}  ${r?.threshold} in ${span}  → ${r?.action}`
  }

  // --- templates (F17) ----------------------------------------------------
  // A template's fields are defaults the form can only narrow. The daemon
  // narrows overrides itself; these keep the form from offering a widening
  // it would quietly not grant.

  const APPROVAL_ORDER = ['auto', 'first-use', 'on-write', 'each']

  /** What a template allows, per field, over all of its grants. */
  function templateLimits(spec) {
    const grants = Array.isArray(spec?.grants) ? spec.grants : [spec || {}]
    const nums = (k) => grants.map((g) => Number(g[k])).filter((n) => Number.isFinite(n) && n >= 0)
    const budgets = nums('budget')
    const ttls = nums('grant_ttl_minutes')
    const rank = (m) => { const i = APPROVAL_ORDER.indexOf(m ?? 'on-write'); return i < 0 ? APPROVAL_ORDER.length : i }
    return {
      creds: grants.map((g) => g.cred).filter(Boolean),
      methods: [...new Set(grants.flatMap((g) => (Array.isArray(g.methods) ? g.methods : ['GET', 'HEAD'])).map((m) => String(m).toUpperCase()))],
      // Overrides apply per grant, so the laxest grant is what any choice
      // can still narrow; a choice laxer than that narrows nothing.
      approvalFloor: Math.min(...grants.map((g) => rank(g.approval))),
      budget: budgets.length === grants.length ? Math.max(...budgets) : null,
      grantTtl: ttls.length === grants.length ? Math.max(...ttls) : null,
      infinite: spec?.infinite === true,
      ttlHours: spec?.infinite === true ? null : Number.isFinite(Number(spec?.ttl_hours)) && spec?.ttl_hours != null ? Number(spec.ttl_hours) : 8,
    }
  }

  /**
   * The overrides a form sends on top of a template: only what the human
   * changed, and only ever narrower. `{ error }` when a value would widen.
   */
  function templateOverrides(limits, chosen) {
    const out = {}
    if (chosen.label) out.label = chosen.label
    const methods = (chosen.methods || []).filter((m) => limits.methods.includes(m))
    if (!methods.length) return { error: 'Pick at least one method the template allows.' }
    if (methods.length < limits.methods.length) out.methods = methods
    if (chosen.approval) {
      if (!APPROVAL_ORDER.includes(chosen.approval) || APPROVAL_ORDER.indexOf(chosen.approval) < limits.approvalFloor) {
        return { error: 'That approval mode is laxer than the template; a template can only be narrowed.' }
      }
      out.approval = chosen.approval
    }
    if (chosen.budget !== undefined && chosen.budget !== '') {
      const n = Number(chosen.budget)
      if (!Number.isFinite(n) || n < 1 || (limits.budget !== null && n > limits.budget)) {
        return { error: `The budget can only go down${limits.budget !== null ? ` from ${limits.budget}` : ''}.` }
      }
      out.budget = n
    }
    if (chosen.lifetime && chosen.lifetime !== 'template') {
      const h = Number(chosen.lifetime)
      if (chosen.lifetime === 'never' || !Number.isFinite(h)) {
        if (!limits.infinite) return { error: 'This template has a lifetime; it cannot be made endless.' }
      } else {
        if (!limits.infinite && h > limits.ttlHours) return { error: `The lifetime can only go down from ${limits.ttlHours} hours.` }
        out.ttl_hours = h
      }
    }
    if (chosen.grantTtl !== undefined && chosen.grantTtl !== '') {
      const n = Number(chosen.grantTtl)
      if (!Number.isFinite(n) || n < 1 || (limits.grantTtl !== null && n > limits.grantTtl)) {
        return { error: 'A grant lifetime can only go down.' }
      }
      out.grant_ttl_minutes = n
    }
    return { overrides: out }
  }

  // --- advanced limits on a new session (F1, F2, F3, F5, F6, F18) ----------

  const MODEL_KINDS = ['anthropic', 'openai', 'google-genai']
  const ROUTE_METHODS = ['GET', 'HEAD', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
  const MAX_ROUTE_ROWS = 16

  /**
   * GrantSpec fields from the advanced inputs. Rate and quota go as typed,
   * for the daemon to parse; numbers go as numbers; the payload is parsed
   * here, before anything is signed, so a typo is said now and not as a
   * refusal after a fingerprint. Empty means absent.
   */
  function advancedFields(raw) {
    const out = {}
    const num = (k, v) => {
      if (v === undefined || v === null || String(v).trim() === '') return true
      const n = Number(v)
      if (!Number.isFinite(n)) return false
      out[k] = n
      return true
    }
    if (raw.rate?.trim()) out.rate = raw.rate.trim()
    if (raw.quota?.trim()) out.quota = raw.quota.trim()
    for (const [k, v] of [['max_concurrent', raw.concurrency], ['redirects', raw.redirects],
      ['grant_ttl_minutes', raw.grantTtl], ['spend_tokens', raw.spendTokens], ['spend_usd', raw.spendUsd]]) {
      if (!num(k, v)) return { error: `${k} must be a number` }
    }
    let payload = null
    if (raw.payload?.trim()) {
      try { payload = JSON.parse(raw.payload) } catch (e) { return { error: `The payload rules are not JSON: ${e.message}` } }
      if (!payload || typeof payload !== 'object' || Array.isArray(payload)) return { error: 'The payload rules must be a JSON object.' }
    }
    if (raw.graphqlQueriesOnly === true) {
      payload = { ...(payload || {}), graphql: { ...(payload?.graphql || {}), operations: ['query'] } }
    }
    if (payload) out.payload = payload
    const rows = (raw.routes || []).filter((r) => (r.methods || []).length || String(r.paths || '').trim())
    if (rows.length > MAX_ROUTE_ROWS) return { error: `At most ${MAX_ROUTE_ROWS} routes.` }
    for (const r of rows) {
      const paths = String(r.paths || '').split(',').map((p) => p.trim()).filter(Boolean)
      if (!(r.methods || []).length || !paths.length) return { error: 'Each route needs at least one method and one path.' }
    }
    if (rows.length) {
      out.routes = rows.map((r) => ({ methods: r.methods.slice(), paths: String(r.paths).split(',').map((p) => p.trim()).filter(Boolean) }))
    }
    return { fields: out }
  }

  function routeRow() {
    return `<div class="route">${ROUTE_METHODS.map((m) =>
      `<label class="pick"><input type="checkbox" class="route-method" value="${m}"> <span>${m}</span></label>`).join('')}
      <input class="route-paths" placeholder="/repos/*/issues, /user" autocomplete="off" style="flex:1;min-width:12rem">
      <button class="action" data-act="rm-route" type="button">Remove</button></div>`
  }

  /** The last probe of a credential (F12): status, latency, scopes. */
  function testLine(t) {
    if (t?.error) return `test: <span class="t-deny">${esc(t.error)}</span>`
    const scopes = Array.isArray(t?.scopes) && t.scopes.length ? ` &middot; scopes: <span class="mono">${esc(t.scopes.join(', '))}</span>` : ''
    return `test: <span class="${t?.status === 'ok' ? 't-allow' : 't-deny'}">${esc(t?.status)}</span>
      &middot; ${esc(t?.http_status ?? 'no answer')} &middot; ${esc(t?.latency_ms)}ms${scopes}`
  }

  /** Extra token shapes to redact, per credential (F4). */
  function scrubDetails(c) {
    const list = Array.isArray(c.scrub_patterns) ? c.scrub_patterns : []
    const sample = scrubSamples.get(c.slug)
    return `<details class="more" data-keep="scrub:${esc(c.slug)}"><summary>Scrub patterns (${list.length})</summary>
      ${list.map((p) => `<div class="row"><div class="main"><code>${esc(p.source)}</code>
          <div class="meta mono">${esc(p.id)} &middot; added ${esc(ago(p.added_at))}</div></div>
        <div class="actions"><button class="action danger" data-act="rm-scrub" data-slug="${esc(c.slug)}" data-id="${esc(p.id)}">Remove</button></div></div>`).join('')}
      <div class="body">
        <p class="meta">Another shape of token to redact from every response, such as
          <code>acme_[A-Za-z0-9]{20,40}</code>. A pattern that could match ordinary text or run long is refused.</p>
        <div class="grid">
          <div><label>Pattern</label><input class="scrub-pattern" data-slug="${esc(c.slug)}" autocomplete="off" spellcheck="false"></div>
          <div><label>Try on text (optional)</label><input class="scrub-sample" data-slug="${esc(c.slug)}" autocomplete="off" spellcheck="false"></div>
        </div>
        <button class="action" data-act="add-scrub" data-slug="${esc(c.slug)}">Add pattern</button>
        ${sample ? `<div class="meta" style="margin-top:8px">${esc(sample.matches)} match(es) in your text:
          <span class="mono">${esc(sample.redacted)}</span></div>` : ''}
      </div></details>`
  }

  /** When the token runs out (F10): a note for you, not a lock. */
  function expiryDetails(c) {
    const day = typeof c.expires_at === 'string' ? c.expires_at.slice(0, 10) : ''
    return `<details class="more" data-keep="expiry:${esc(c.slug)}"><summary>Expiry${day ? ` (${esc(day)})` : ''}</summary>
      <div class="body">
        <div class="grid"><div><label>Expires on</label>
          <input type="date" class="expiry-date" data-slug="${esc(c.slug)}" value="${esc(day)}"></div></div>
        <div class="actions" style="justify-content:flex-start">
          <button class="action" data-act="set-expiry" data-slug="${esc(c.slug)}">Set expiry</button>
          ${c.expires_at ? `<button class="action" data-act="clear-expiry" data-slug="${esc(c.slug)}">Clear</button>` : ''}
        </div>
        <p class="meta">A reminder, not enforcement: an expired token is still sent until the upstream refuses it.</p>
      </div></details>`
  }

  let credKinds = new Map()     // slug -> kind, for which inputs a session form shows

  /** The New session form: free-form, or narrowing a template (F17). */
  function newSessionCard(creds, templates) {
    const list = Array.isArray(templates) ? templates : []
    const pickTemplate = list.length ? `<div style="margin-bottom:12px"><label for="sTemplate">Start from template</label>
      <select id="sTemplate"><option value="">none: set every field below</option>${list.map((t) =>
        `<option value="${esc(t.name)}"${formTemplate?.name === t.name ? ' selected' : ''}>${esc(t.name)} v${esc(t.version)}: ${esc(t.summary || '')}</option>`).join('')}</select></div>` : ''
    return `<div class="card"><h2>New session</h2><div class="body">
      ${pickTemplate}
      ${formTemplate ? templateForm(formTemplate) : freeForm(creds)}
    </div></div>`
  }

  function freeForm(creds) {
    const options = creds.map((c, i) => `<option value="${esc(c.slug)}"${i === 0 ? ' selected' : ''}>${esc(c.slug)}</option>`).join('')
    const models = creds.length && MODEL_KINDS.includes(creds[0].kind)
    return `
      <div class="grid">
        <div><label for="sCred">Credentials</label><select id="sCred" multiple size="${Math.min(4, creds.length)}">${options}</select></div>
        <div><label for="sLabel">Label</label><input id="sLabel" placeholder="issue triage" autocomplete="off"></div>
        <div><label for="sMethods">Methods</label><input id="sMethods" value="GET,HEAD" autocomplete="off"></div>
        <div><label for="sPaths">Paths</label><input id="sPaths" value="/**" autocomplete="off"></div>
        <div><label for="sBudget">Budget</label><input id="sBudget" type="number" value="500" min="1"></div>
        <div><label for="sApproval">Approval</label><select id="sApproval">
          <option value="on-write">ask me before writes (on-write)</option>
          <option value="each">ask me every time</option>
          <option value="first-use">ask me the first time</option>
          <option value="auto">never ask (auto)</option>
        </select></div>
        <div><label for="sLifetime">Lifetime</label><select id="sLifetime">
          <option value="1">1 hour</option>
          <option value="8" selected>8 hours</option>
          <option value="24">24 hours</option>
          <option value="never">No expiry</option>
        </select></div>
        <div><label for="sGrantTtl">Grant lifetime (minutes, optional)</label><input id="sGrantTtl" type="number" min="1" placeholder="as long as the session"></div>
      </div>
      <details class="more" data-keep="advanced" style="padding:8px 0 12px;border-top:0"><summary>Advanced limits</summary>
        <div class="grid" style="margin-top:10px">
          <div><label for="sRate">Rate</label><input id="sRate" placeholder="60/min" autocomplete="off"></div>
          <div><label for="sConcurrency">Concurrency</label><input id="sConcurrency" type="number" min="1" placeholder="no limit"></div>
          <div><label for="sQuota">Quota</label><input id="sQuota" placeholder="1000/day" autocomplete="off"></div>
          <div><label for="sRedirects">Follow redirects (0–5)</label><input id="sRedirects" type="number" min="0" max="5" placeholder="0"></div>
        </div>
        <div class="grid" id="spendBox"${models ? '' : ' hidden'}>
          <div><label for="sSpendTokens">Spend limit: tokens</label><input id="sSpendTokens" type="number" min="0" placeholder="no limit"></div>
          <div><label for="sSpendUsd">Spend limit: USD (an estimate)</label><input id="sSpendUsd" type="number" min="0" step="0.01" placeholder="no limit"></div>
        </div>
        <label for="sPayload">Payload rules (JSON, optional)</label>
        <textarea id="sPayload" spellcheck="false" placeholder='{ "json": { "/channel": { "one_of": ["#bots"] } } }'></textarea>
        <label class="pick" style="margin:8px 0 12px"><input type="checkbox" id="sGraphql"> <span>GraphQL: queries only</span></label>
        <label>Routes: a method may only be used on its paths (up to ${MAX_ROUTE_ROWS})</label>
        <div class="routes" id="routes"></div>
        <button class="action" data-act="add-route" type="button">Add route</button>
      </details>
      <div class="notice warn" id="sAutoWarn" hidden>No approval prompts for writes. Your authenticator is asked every time you create one.</div>
      <div class="notice warn" id="sNeverWarn" hidden>This session never expires. It lasts until you revoke it, and your authenticator is asked every time you create one.</div>
      <div class="actions" style="justify-content:flex-start">
        <button class="action primary" data-act="add-session">Create session</button>
        <button class="action" data-act="save-template">Save as template</button>
      </div>`
  }

  /** The same form over a template: its values are the ceiling, and only lower ones are offered. */
  function templateForm(t) {
    const L = t.limits
    const hours = [1, 8, 24]
    const elevated = t.elevated || []
    return `
      <div class="notice">Starting from template <strong>${esc(t.name)}</strong> v${esc(t.version)}
        for <span class="mono">${esc(L.creds.join(', ') || 'its credentials')}</span>. These fields can only narrow it.</div>
      <div class="grid">
        <div><label for="sLabel">Label</label><input id="sLabel" placeholder="from the template" autocomplete="off"></div>
        <div><label>Methods</label>${L.methods.map((m) =>
          `<label class="pick"><input type="checkbox" class="t-method" value="${esc(m)}" checked> <span>${esc(m)}</span></label>`).join('')}</div>
        <div><label for="tApproval">Approval</label><select id="tApproval">
          <option value="">as the template says</option>
          ${APPROVAL_ORDER.map((m, i) => `<option value="${m}"${i < L.approvalFloor ? ' disabled' : ''}>${m}</option>`).join('')}
        </select></div>
        <div><label for="tBudget">Budget</label><input id="tBudget" type="number" min="1"${L.budget !== null ? ` max="${esc(L.budget)}"` : ''} placeholder="${L.budget !== null ? `up to ${esc(L.budget)}` : 'as the template says'}"></div>
        <div><label for="tLifetime">Lifetime</label><select id="tLifetime">
          <option value="template">as the template says (${L.infinite ? 'no expiry' : `${esc(L.ttlHours)} hours`})</option>
          ${hours.map((h) => `<option value="${h}"${!L.infinite && h > L.ttlHours ? ' disabled' : ''}>${h} hour${h > 1 ? 's' : ''}</option>`).join('')}
        </select></div>
        <div><label for="tGrantTtl">Grant lifetime (minutes)</label><input id="tGrantTtl" type="number" min="1"${L.grantTtl !== null ? ` max="${esc(L.grantTtl)}"` : ''} placeholder="${L.grantTtl !== null ? `up to ${esc(L.grantTtl)}` : 'as long as the session'}"></div>
      </div>

  /** What the free-form New session form would create, or `{ error }`. */
  function readSessionForm() {
    const picked = [...document.getElementById('sCred').selectedOptions].map((o) => o.value)
    if (!picked.length) return { error: 'Pick at least one credential' }
    if (picked.length > 16) return { error: 'A session holds at most 16 credentials' }
    const value = (id) => document.getElementById(id)?.value ?? ''
    const models = picked.some((slug) => MODEL_KINDS.includes(credKinds.get(slug)))
    const adv = advancedFields({
      rate: value('sRate'), concurrency: value('sConcurrency'), quota: value('sQuota'),
      redirects: value('sRedirects'), grantTtl: value('sGrantTtl'),
      // Spend only means something for a model provider; hidden is absent.
      spendTokens: models ? value('sSpendTokens') : '', spendUsd: models ? value('sSpendUsd') : '',
      payload: value('sPayload'), graphqlQueriesOnly: document.getElementById('sGraphql')?.checked === true,
      routes: [...document.querySelectorAll('#routes .route')].map((row) => ({
        methods: [...row.querySelectorAll('.route-method:checked')].map((b) => b.value),
        paths: row.querySelector('.route-paths').value,
      })),
    })
    if (adv.error) return { error: adv.error }
    // The same limits for every credential picked, one grant each.
    const shared = {
      methods: value('sMethods').split(',').map((m) => m.trim().toUpperCase()).filter(Boolean),
      paths: value('sPaths').split(',').map((p) => p.trim()).filter(Boolean),
      budget: Number(value('sBudget')),
      approval: value('sApproval'),
      ...adv.fields,
    }
    const lifetime = value('sLifetime')
    return {
      body: {
        label: value('sLabel').trim() || 'ui session',
        grants: picked.map((cred) => ({ cred, ...shared })),
        // No expiry is no lifetime at all, never a long one.
        ...(lifetime === 'never' ? { infinite: true } : { ttl_hours: Number(lifetime) }),
      },
      picked,
    }
  }

  /** The three one-click narrowings on a live session (F15). */
  const NARROWINGS = {
    'drop-writes': { title: 'Write access dropped', body: (sid) => ({ sid, narrow: { methods: ['GET', 'HEAD'] } }) },
    'approve-each': { title: 'Every request now needs your approval', body: (sid) => ({ sid, narrow: { approval: 'each' } }) },

  }

  async function setExpiry(slug, expiresAt) {
    const body = { slug, expires_at: expiresAt }
    await gated(await operationFor('cred.expiry_set', body), (proof) =>
      api('POST', 'credentials/expiry', { ...body, presence: proof }))
    toast(expiresAt ? `${slug} expires ${expiresAt.slice(0, 10)}` : `Cleared the expiry on ${slug}`)
    slow.clear()

  async function setTripwires(body, done) {
    tripwireState = await gated(await operationFor('tripwires.set', body), (proof) =>

    toast(done)
    slow.clear()
    render()

  /**
   * Replace the confirmation authenticator. The new key is registered first;
   * then the CURRENT key signs the new key's exact public record, and the
   * daemon enrols it only on that signature. An agent with this page open
   * reaches the platform dialog for the current key, and stops there.
   */
  async function replaceKey() {
    const opts = await api('POST', 'presence/rotate/begin')
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: b64uToBuf(opts.challenge),
        rp: opts.rp,
        user: { id: b64uToBuf(opts.user.id), name: opts.user.name, displayName: opts.user.displayName },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        excludeCredentials: opts.exclude ? [{ id: b64uToBuf(opts.exclude), type: 'public-key' }] : [],
        timeout: 120000,
        attestation: 'none',
      },
    })
    const { credential } = await api('POST', 'presence/rotate/register', {
      attestationObject: bufToB64u(cred.response.attestationObject),
      clientDataJSON: bufToB64u(cred.response.clientDataJSON),
    })
    await gated(await operationFor('presence.enroll', credential), (proof) =>
      api('POST', 'presence/rotate', { ...credential, presence: proof }))
    await refreshPresence()
  }

  // ------------------------------------------------------------ view state
  // What the human did on a view that a re-render must not throw away.

  let sessionDetail = null      // GET sessions/detail, while its card is open
  let narrowResult = null       // the before/after of the last narrow
  let formTemplate = null       // { name, version, hash, spec, limits, elevated } while creating from one
  let checkpoint = null         // the last audit checkpoint fetched
  let tripwireState = null      // GET tripwires, for "turn on" to know if rules exist
  let focusItem = hashView === 'approvals' && hashSection ? decodeURIComponent(hashSection) : null
  const testResults = new Map() // slug -> the last probe's answer
  const scrubSamples = new Map() // slug -> the sample the last added pattern was tried on

  // Reads that change slowly, kept for half a minute so the five-second
  // overview refresh does not ask the daemon for each of them every time.
  // Anything this page changes clears them.
  const slow = new Map()
  async function cached(key, fn, ms = 30_000) {
    const hit = slow.get(key)
    if (hit && hit.at > Date.now() - ms) return hit.value
    const value = await fn()
    slow.set(key, { at: Date.now(), value })
    return value
  }

  // A disclosure the human opened stays open across the re-render.
  const openDetails = new Set()
  document.addEventListener('toggle', (e) => {
    const key = e.target?.dataset?.keep
    if (!key) return
    if (e.target.open) openDetails.add(key)
    else openDetails.delete(key)
  }, true)
  function restoreDetails() {
    for (const d of document.querySelectorAll('details[data-keep]')) d.open = openDetails.has(d.dataset.keep)
  }

  /**
   * Desktop notifications (F14): a signal, never an approval channel. No
   * actions on it; clicking only opens the approvals view, where a decision
   * still needs your fingerprint. Only while this tab is open.
   */
  const NOTIFY_KEY = 'agent-vault.notify'
  const notificationsOn = () => {
    try { return localStorage.getItem(NOTIFY_KEY) === 'on' } catch { return false }
  }
  const seenPending = new Set()
  let pendingPrimed = false
  function notifyNew(pending) {
    const fresh = pending.filter((p) => !seenPending.has(p.id))
    for (const p of pending) seenPending.add(p.id)
    // What was waiting when the page opened is on screen already.
    if (!pendingPrimed) { pendingPrimed = true; return }
    if (!fresh.length || !notificationsOn()) return
    if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return
    const body = fresh.length > 1 ? `${notificationText(fresh[0])} (and ${fresh.length - 1} more)` : notificationText(fresh[0])
    try {
      const n = new Notification('agent-vault', { body, tag: 'agent-vault-pending' })
      n.onclick = () => { window.focus(); openApproval(fresh[0].id) }
    } catch { /* a browser that will not show one has nothing to fall back to */ }
  }

  /** Open the approvals view on one item: the `#approvals/<id>` deep link. */
  function openApproval(id) {
    current = 'approvals'
    focusItem = id
    syncNav()
    render()
  }
  function highlightFocus() {
    if (current !== 'approvals' || !focusItem) return
    const card = [...document.querySelectorAll('[data-item]')].find((c) => c.dataset.item === focusItem)
    if (!card) return
    card.classList.add('highlight')
    card.scrollIntoView({ block: 'center' })
    focusItem = null
  }

  /** A form in a page-drawn dialog: resolves with read(form), or null on cancel. */
  function dialog(inner, read, { submit = 'OK', danger = false } = {}) {
    return new Promise((resolve) => {
      const back = document.createElement('div')
      back.className = 'modal-back'
      back.innerHTML = `<form class="modal">${inner}
        <div class="modal-actions">
          <button type="button" class="action" data-x="cancel">Cancel</button>
          <button type="submit" class="action ${danger ? 'panic' : 'primary'}">${esc(submit)}</button>
        </div></form>`
      document.body.appendChild(back)
      const form = back.querySelector('form')
      const onKey = (e) => { if (e.key === 'Escape') close(null) }
      const close = (val) => { document.removeEventListener('keydown', onKey); back.remove(); resolve(val) }
      back.querySelector('[data-x="cancel"]').onclick = () => close(null)
      back.onclick = (e) => { if (e.target === back) close(null) }
      form.onsubmit = (e) => { e.preventDefault(); close(read(form)) }
      document.addEventListener('keydown', onKey)
      setTimeout(() => form.querySelector('input, select, textarea, button[type=submit]')?.focus(), 20)
    })
  }

  const askText = (label, { placeholder = '', submit = 'OK' } = {}) => dialog(
    `<label for="askText">${esc(label)}</label><input id="askText" autocomplete="off" placeholder="${esc(placeholder)}">`,
    (f) => f.querySelector('#askText').value.trim(), { submit })

  /** Shown before a signature that the platform dialog cannot describe. */
  const showOperation = (title, operation) => dialog(
    `<label>${esc(title)}</label>
     <p class="meta">This is what your authenticator will sign. The new value is bound by its digest and never shown.</p>
     <pre class="untrusted" style="border-style:solid;border-color:var(--line)">${esc(JSON.stringify(operation, null, 2))}</pre>`,
    () => true, { submit: 'Sign it' })

  // ------------------------------------------------------------------ views

  const views = {
    async overview() {
      const [status, creds, sessions, approvals] = await Promise.all([
        api('GET', 'status'), api('GET', 'credentials'), api('GET', 'sessions'), api('GET', 'pending'),
      ])
      const live = sessions.filter((s) => s.state === 'active')
      // Each card stands alone: a daemon without a route, or a locked vault,
      // leaves that card out rather than the page blank.
      const quiet = (p) => p.catch(() => null)
      const [report, tripwires, fired, notify, c] = await Promise.all([
        status.locked ? null : quiet(cached('report', () => api('GET', 'report/access?since=7d'))),
        quiet(cached('tripwires', () => api('GET', 'tripwires'))),
        status.locked ? null : quiet(cached('fired', () => api('GET', 'audit?kind=tripwire.fired&limit=5'))),
        quiet(cached('notify', () => api('GET', 'notify'))),
        loadDocsCtx(),
      ])
      tripwireState = tripwires
      await refreshPresence()
      const gate = presenceState.enrolled
        ? `<div class="card"><h2>Confirmation</h2><div class="row">
             <div class="main"><div class="name">Authenticator enrolled <span class="pill ok">active</span></div>
             <div class="meta">Every change asks for Touch ID, and the signature covers that one operation.
               A browser driven by software reaches the dialog and stops there.</div></div>
             <div class="actions"><button class="action" data-act="replace-key"

        : `<div class="notice"><strong>Changes need confirmation.</strong>

      let lockBanner = ''

          ? `<button class="action primary" data-act="touchid-unlock">Unlock with Touch ID</button>`
          : ''

        const hint = !ls.has_touchid && ls.has_passphrase && prfSupported()
          ? `<div class="meta" style="margin-top:8px">Want to unlock with a fingerprint next time? Unlock once with your passphrase, then turn on <strong>Touch ID unlock</strong> on this page.</div>`

      return `

    },

    async credentials() {

            ${soonestExpiry(c) !== null ? `<div class="meta">${esc(expiresIn(soonestExpiry(c)))} (${esc(new Date(soonestExpiry(c)).toISOString().slice(0, 10))}${c.health?.observed_expires_at ? ', as the upstream reports it' : ''})</div>` : ''}
            ${q ? `<div class="meta">quarantined ${esc(q.since ? ago(q.since) : '')} by ${esc(q.by)}${q.rule_id ? ` (tripwire ${esc(q.rule_id)})` : ''}${q.reason_untrusted
              ? `: <span class="mono">${esc(q.reason_untrusted)}</span> (written by whoever quarantined it, not verified)` : ''}</div>` : ''}
            ${test ? `<div class="meta">${testLine(test)}</div>` : ''}

          </div>

            <input id="value" type="password" autocomplete="new-password" spellcheck="false"
                   placeholder="paste the token; it is not echoed and never returned"></div>
          <button class="action primary" data-act="add-cred">Store credential</button>
        </div></div>`
    },

    async sessions() {
      const [sessions, creds, templates] = await Promise.all([
        api('GET', 'sessions'), api('GET', 'credentials'),
        api('GET', 'templates').catch(() => []),
      ])
      credKinds = new Map(creds.map((c) => [c.slug, c.kind]))
      const rows = sessions.length ? sessions.map((s) => `
        <div class="row">
          <div class="main">
            <div class="name">${esc(s.label)}

              ${approvalBadge(s)}
              ${s.infinite ? '<span class="pill warn">infinite</span>' : ''}
              ${(s.elevated || []).length ? `<span class="pill warn" title="${esc(s.elevated.join(', '))}">elevated</span>` : ''}
              ${s.template ? `<span class="pill">template ${esc(s.template)}</span>` : ''}</div>
            <div class="meta"><span class="mono">${esc(s.id)}</span> &middot; ${esc(s.grants)} grant(s) &middot;

          </div>
          <div class="actions">
            <button class="action" data-act="detail" data-sid="${esc(s.id)}">Details</button>
            ${s.state === 'active' ? `
            <button class="action" data-act="narrow" data-narrow="drop-writes" data-sid="${esc(s.id)}" title="Only GET and HEAD from now on">Drop write access</button>
            <button class="action" data-act="narrow" data-narrow="approve-each" data-sid="${esc(s.id)}" title="Every request waits for you">Require approval for everything</button>
            <button class="action" data-act="narrow" data-narrow="end-1h" data-sid="${esc(s.id)}" title="It ends within the hour, whatever lifetime it had">End in 1 hour</button>
            <button class="action danger" data-act="revoke" data-sid="${esc(s.id)}">Revoke</button>` : ''}
          </div>
        </div>`).join('') : '<div class="empty">No sessions yet.</div>'

      return `
        <header class="page"><h1>Sessions</h1></header>
        <p class="sub">A session is what an agent holds. Revoking one cuts off every placeholder it issued.
          Narrowing one takes capability away while it runs; nothing here can widen a live session.</p>
        ${handoffCard()}
        ${narrowResult ? `<div class="card"><h2>${esc(narrowResult.title)}</h2>${narrowSummary(narrowResult.result)}
          <div class="body"><button class="action" data-act="dismiss-narrow">Done</button></div></div>` : ''}
        ${sessionDetail ? detailCard(sessionDetail) : ''}
        <div class="card"><h2>Sessions</h2>${rows}</div>
        ${creds.length ? newSessionCard(creds, templates) : ''}
