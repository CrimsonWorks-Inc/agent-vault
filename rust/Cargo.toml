[workspace]
resolver = "2"
members = ["crates/av-core", "crates/av-store", "crates/av-daemon", "crates/av-cli", "xtask"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.99"

# The approved dependency list (rust/PLAN.md, "Dependencies"). A crate takes
# what it needs with `foo.workspace = true`; ask the coordinator before adding
# anything that is not here.
[workspace.dependencies]
av-core = { path = "crates/av-core" }
av-store = { path = "crates/av-store" }
av-daemon = { path = "crates/av-daemon" }

# Runtime and HTTP
tokio = { version = "1.54", features = ["full"] }
hyper = { version = "1.12", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
http-body-util = "0.1.5"
# TLS (replaces the openssl subprocess)
rustls = "0.23"
tokio-rustls = "0.26"
rcgen = "0.14"
# Storage
rusqlite = { version = "0.42", features = ["bundled"] }
# Crypto
chacha20poly1305 = "0.11"
argon2 = "0.6"
scrypt = "0.12"
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
secrecy = "0.10"
subtle = "2.6"
rand = "0.10"
getrandom = "0.4"
p256 = "0.14"
ecdsa = "0.17"
ed25519-dalek = "3"
# Encoding
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
ciborium = "0.2"
url = "2.5"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# Platform
libc = "0.2"
# CLI
clap = { version = "4.6", features = ["derive"] }
rpassword = "7.5"
# Misc
regex = "1.13"
thiserror = "2"
tracing = "0.1"
# Dev
proptest = "1.12"
tempfile = "3.27"
assert_cmd = "2.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
