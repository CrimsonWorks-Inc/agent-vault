# Protections in av-store that the tests must catch. `cargo xtask mutation`
# applies each swap to a temporary copy of rust/ and requires `cargo test` to
# fail. Fields: name, file (relative to this crate), from (must appear exactly
# once), to, and optionally test (a `cargo test` name filter).
#
# These reproduce the src/store/*, src/pending.js and src/client-state.js
# entries of test/mutation-check.js (read as text, never imported), each
# named as the JS names it, followed by protections that exist only in the
# port (transactions, WAL checkpoints, migrate, locked memory).
#
# JS entries with no line of their own here, and why:
# - "a revocation / a rotation / a restore is written without an fsync", "a
#   vault writer is on neither durability list", "a one-line method that
#   writes the vault is on no durability list": every operation is one
#   transaction under `synchronous=FULL`; the db.rs entries below (and
#   db::tests::pragmas_are_set_after_open) are that protection.
# - "the backup key is derived synchronously": the port's KDFs are blocking
#   functions the daemon runs with spawn_blocking; nothing in the store
#   decides that.
# - "the webhook URL is stored unsealed beside its sealed copy": the notify
#   table has no column a URL could go in; key_material::no_plaintext_value_
#   is_ever_written_to_the_files scans the files for it.
# - "a restore writes each credential as it goes": a restore is one
#   transaction; "a refused operation's changes are committed" below breaks
#   that and the restore tests catch it.

[[mutation]]
name = "secure_delete is switched off when the vault database is opened"
file = "src/db.rs"
