# Ports all 76 src/core protections in test/mutation-check.js.
# C27 decision fields use usize indices: mutants 71/72 test their identity; text leakage cannot compile.

[[mutation]]
name = "the streaming scrubber tears matches at the cut"
file = "src/scrub.rs"
from = "self.scrubber.scrub(&combined[..cut])"
to = "self.scrubber.scrub(&combined[..combined.len()-keep])"
test = "stream_cut_regressions"

[[mutation]]
name = "an encoded placeholder counts as an injection site"
file = "src/substitute.rs"
from = "if location.encoding != HitEncoding::Raw {"
to = "if false && location.encoding != HitEncoding::Raw {"
test = "encoded_locations"

