from = "out.push_str(r\"[^\\n\\r\\x{2028}\\x{2029}]\");"
to = "out.push('.');"
test = "js_dot_classes_and_flag_refusals"

[[mutation]]
name = "JavaScript class ampersands and tildes remain literal"
