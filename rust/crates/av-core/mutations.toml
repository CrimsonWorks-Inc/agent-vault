to = "let mut s = s.trim_end_matches('=').to_owned();"
test = "js_detector_vectors"

[[mutation]]
name = "JavaScript detector whitespace keeps FEFF and excludes NEL"
file = "src/detect.rs"
from = "crate::jsre::compile(r\"\\\\[nrtbf]|\\s+\")"
to = "regex::Regex::new(r\"\\\\[nrtbf]|\\s+\")"
test = "js_detector_feff_nel"

[[mutation]]
name = "JavaScript multipart disposition whitespace exposes the override"
file = "src/request_view.rs"
from = "crate::jsre::compile(r#\"(?i);\\s*name\\*?\\s*=\\s*(?:\"([^\"]*)\"|([^;]*))\"#)"
to = "regex::Regex::new(r#\"(?i);\\s*name\\*?\\s*=\\s*(?:\"([^\"]*)\"|([^;]*))\"#)"
test = "js_multipart_feff_nel"

[[mutation]]
name = "JavaScript model content types require ASCII words and JS whitespace"
file = "src/model_usage.rs"
from = "crate::jsre::compile(r\"(?i)^application/(?:json|[\\w.+-]+\\+json)(?:\\s*;|\\s*$)\")"
to = "regex::Regex::new(r\"(?i)^application/(?:json|[\\w.+-]+\\+json)(?:\\s*;|\\s*$)\")"
test = "js_model_content_types"

[[mutation]]
name = "dot retains JavaScript line terminator exclusions"
