[[mutation]]
name = "request hash credentials use UTF16 ordering"
file = "src/canon.rs"
from = "credentials.sort_by_key(|s| s.encode_utf16().collect::<Vec<_>>());"
to = "credentials.sort();"
test = "js_request_hash_utf16"

[[mutation]]
name = "request hash header names use UTF16 ordering"
file = "src/canon.rs"
from = "headers.sort_by_key(|(name, _)| name.encode_utf16().collect::<Vec<_>>());"
to = "headers.sort_by(|a, b| a.0.cmp(&b.0));"
test = "js_request_hash_utf16"

