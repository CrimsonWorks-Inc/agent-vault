# JS `force does not check that what the rename put in place is the file it wrote`
# (src/cli/files.js): `is_same_file` only fails when the destination inode is
# swapped in the gap after rename. A unit test cannot plant that race, and
# ordinary writes still succeed if the check is removed, so the mutant would
# be missed.

[[mutation]]
name = "an appended file keeps whatever mode it had"
file = "src/files.rs"
from = '''    let mut perms = file.metadata()?.permissions();
    perms.set_mode(0o600);
    file.set_permissions(perms)?;
    let text = if line.ends_with'''
to = '''    let text = if line.ends_with'''
test = "append_tightens_the_mode_to_0600"

