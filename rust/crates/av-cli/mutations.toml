# JS `CLI approve drops a typed narrowing flag that parsed into nothing`
# (src/cli/policy-input.js): every flag `approval_overrides` accepts is either
# rejected by parseOverrides (the C23 entry) or present on the override object.
# The "narrows nothing" loop does not fail for a value the parser accepted, so
# flipping it does not fail a test.

# JS `CLI approve sends a non-finite number, which JSON turns into an absent
# narrowing` (src/cli/policy-input.js): serde_json cannot carry NaN or
# Infinity, and `number_flag` already refuses a non-finite token. That refusal
# is the entry "CLI numeric limits accept invalid finite or integer bounds".

[[mutation]]
name = "CLI approve reads the daemon before refusing an unreadable narrowing"
file = "src/commands.rs"
from = '''    let overrides = if granted {
        let args = approve.ok_or_else(|| err("name the id to answer", Exit::Usage))?;
        Some(policy_input::approval_overrides(args)?)
    } else {
        None
    };
    let pending = load_pending(ctx).await?;'''
to = '''    let pending = load_pending(ctx).await?;
    let overrides = if granted {
        let args = approve.ok_or_else(|| err("name the id to answer", Exit::Usage))?;
        Some(policy_input::approval_overrides(args)?)
    } else {
        None
    };'''
test = "approve_refuses_an_unreadable_narrowing_before_the_daemon"

