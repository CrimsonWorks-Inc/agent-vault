# Protections in av-daemon that the tests must catch. `cargo xtask mutation`
# applies each swap to a temporary copy of rust/ and requires `cargo test` to
# fail. Fields: name, file (relative to this crate), from (must appear exactly
# once), to.
#
# Each entry reproduces one src/daemon/*, src/ui/*, src/connectors/pinning.js
# or src/connectors/probe.js entry of test/mutation-check.js (read as text,
# never imported) and carries its `what` as the name. src/pending.js entries
# are av-store's (crates/av-store/mutations.toml). The JS entries not yet
# reproduced here are listed, by name, in PORTED.md ("Mutation check").


[[mutation]]
name = 'a batch of decisions is settled with no human present'
file = "src/server/routes.rs"
from = 'self.gate_session("bulk decision", operation, &elevated, presence).await?;'
to = 'let _ = (operation, elevated, presence);'

[[mutation]]
name = 'the human-presence gate never refuses'
file = "src/server.rs"
from = '''let factors = self.dm_factors()?;
        if factors.is_empty() {
            self.audit_opt("control.widening_ungated"'''
to = '''let factors = self.dm_factors()?;
        if true || factors.is_empty() {
            self.audit_opt("control.widening_ungated"'''

