# Protections in av-daemon that the tests must catch. `cargo xtask mutation`
# applies each swap to a temporary copy of rust/ and requires `cargo test` to
# fail. Fields: name, file (relative to this crate), from (must appear exactly
# once), to.
#
# Every entry of test/mutation-check.js (read as text, never imported) whose
# file is src/daemon/*, src/ui/*, src/pending.js or src/connectors/* is here,
# under its `what` as the name, or is in another crate's mutations.toml (named
# where it applies), or is a NOT APPLICABLE comment block giving the reason the
# protection cannot be removed in the Rust code. A few entries break a
# protection that lives in av-core or av-store (`file = "../av-core/..."`):
# the daemon calls it, and the daemon's own tests catch the mutant.


