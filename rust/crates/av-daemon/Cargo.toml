[package]
name = "av-daemon"
description = "The daemon: control socket, gateway, MCP, web UI server, connectors (ports src/daemon/*, src/ui/*, src/connectors/*)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "agent-vault-daemon"
path = "src/bin/agent-vault-daemon.rs"

[dependencies]
av-core.workspace = true
av-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
libc.workspace = true
url.workspace = true
regex.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
sha2.workspace = true
hmac.workspace = true
subtle.workspace = true
rand.workspace = true
getrandom.workspace = true
base64.workspace = true
p256.workspace = true
ecdsa.workspace = true
ciborium.workspace = true
time.workspace = true
zeroize.workspace = true
secrecy.workspace = true
# rcgen's default features pull in `ring`, a second crypto stack; this takes
# the approved crate at the workspace version with the aws-lc-rs provider
# rustls already uses. (The workspace entry keeps defaults on, and a member
# cannot turn them off through `workspace = true`.)
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
# Approved for the daemon by the coordinator (rust/PLAN.md, "Dependencies"):
# response decompression before scrubbing (pure Rust backends), the upstream
# trust store (Node's bundled Mozilla roots), certificate parsing for pins and
# the managed certificate, and the verified path for non-leaf pins.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
brotli-decompressor = "5"
webpki-roots = "1"
x509-parser = { version = "0.18", default-features = false }
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["std", "aws-lc-rs"] }

[dev-dependencies]
tempfile.workspace = true
