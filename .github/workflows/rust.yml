# agent-vault (rust/). Format, lint with warnings as errors, test, check
# dependencies against rust/deny.toml, and run the black-box conformance
# suite against the built binaries, on Linux and macOS. The toolchain is the
# one pinned in rust/rust-toolchain.toml. Node is needed for the tests that
# compare against the frozen JavaScript reference (legacy/js) and for the
# conformance runner.

name: rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

defaults:
  run:
    working-directory: rust

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rustup installs the pinned toolchain (and rustfmt, clippy) on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Conformance (black-box, against the built binaries)
        working-directory: .
        run: AV_IMPL=rust AV_REQUIRE_IMPL=1 npm run conformance

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Dependencies (cargo deny)
        run: cargo deny check
