# The web UI and the frozen JavaScript reference.
#
# agent-vault itself is Rust (see rust.yml). The control page is still built
# with Vite and React from web/ into src/ui/dist, which the Rust daemon embeds
# at compile time, so this checks the committed bundle against a fresh build
# and runs the page's own tests. The JavaScript implementation is frozen in
# legacy/js as the reference the Rust tests compare against; its suite runs
# here so the reference itself stays trustworthy.

name: ui

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install devDependencies from the lockfile
        run: npm ci
      - name: UI tests and the bundle drift check
        run: npm test

  legacy-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The reference's parity tests bundle web/ with Vite.
      - name: Install devDependencies from the lockfile
        run: npm ci
      - run: npm run test:legacy
