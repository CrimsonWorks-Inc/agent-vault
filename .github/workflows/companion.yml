# The menu bar companion (desktop/). Format, lint with warnings as errors,
# test, then build a universal macOS app and a .dmg that people can download
# from the run. The companion is its own Cargo workspace: it links none of the
# daemon's crates and does not use the toolchain pinned in rust/.
#
# The .dmg is not signed with a Developer ID or notarized, so macOS blocks it
# when it is downloaded with a browser. Signing needs the same Apple secrets
# release.yml describes; until they are set, this build is for testing.

name: companion

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/companion.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/companion.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the Tauri CLI
        run: npm ci

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build the app and the installer
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: agent-vault-companion-macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
