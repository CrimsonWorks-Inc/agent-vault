[package]
name = "agent-vault-companion"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Menu bar companion for agent-vault: status, alerts and one-click narrowing actions"
publish = false

# Its own workspace: the companion is not part of the daemon's build or its
# pinned toolchain, and links none of its crates.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde_json = "1"
chrono = "0.4"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[profile.release]
strip = true
lto = true
